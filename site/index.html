/* ================= 巴菲特午餐会 · 本地检索式问答 =================
   不接大模型、不上传任何提问：在浏览器里把问题切成中文 n-gram，
   对 98 封信（约 8 千个正文段落）算一遍 tf-idf，挑最相关的原文，
   连同年份和段落号贴回来，每条都能点回原信。
   这个体量（130 万字、8 千段）不需要向量库：字面检索就够快，
   也没有 embedding 的构建、存储和调用成本；真接大模型时再把这里的 top-k 当上下文即可。 */
var TALK = { msgs: [], draft: '', lastEnt: '', lastQ: '', asked: '', busy: false, seen: {},
  session: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) };

/* 线描茶杯：不依赖 emoji 字体，深浅背景下都能看清 */
function cupSVG(size){
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0">' +
    '<path d="M4 9.5h11v4.6a4.4 4.4 0 0 1-4.4 4.4H8.4A4.4 4.4 0 0 1 4 14.1z"/>' +
    '<path d="M15 10.6h1.7a2.4 2.4 0 0 1 0 4.8H15"/>' +
    '<path d="M7.2 5.6c0 1 .9 1.2.9 2.2M11 4.6c0 1.2.9 1.4.9 2.4"/>' +
    '<path d="M3.4 20.8h13"/></svg>';
}

/* 虚词不参与切词：「你怎」「么看」这类碎片只会把结果带偏 */
var TSTOP = '的了吗呢吧啊呀么怎你您我他她它这那有是会就要能可以什么为如何请告诉一下说说讲讲看想觉得把被让给对从到和与跟更最很太都也还又再就才只';
function talkClean(q){
  return String(q).replace(/[^\u4e00-\u9fa5A-Za-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
}
function talkTerms(q){
  var out = [], seen = {};
  function add(g, w){ if (!g || seen[g]) return; seen[g] = 1; out.push({ g: g, w: w }); }
  talkClean(q).split(' ').forEach(function(run){
    if (!run) return;
    if (/^[A-Za-z0-9]+$/.test(run)){ add(run.toLowerCase(), 2); return; }
    var n = run.length;
    if (n >= 2 && n <= 8) add(run, 3);          // 整段短语权重最高
    for (var i = 0; i + 2 <= n; i++){
      var bg = run.slice(i, i + 2);
      if (TSTOP.indexOf(bg.charAt(0)) < 0 && TSTOP.indexOf(bg.charAt(1)) < 0) add(bg, 1.2);
    }
    for (var j = 0; j + 3 <= n; j++){
      var tg = run.slice(j, j + 3);
      if (TSTOP.indexOf(tg.charAt(0)) < 0 && TSTOP.indexOf(tg.charAt(2)) < 0) add(tg, 2);
    }
  });
  return out;
}

/* 段落库：只建一次。表格段落也收，但打分时降权（数字多、句子碎） */
var TDOC = null, TDOCI = null;
function talkDocs(){
  if (TDOC) return TDOC;
  var arr = [], map = {};
  C.letters.forEach(function(l){
    var L2 = L[l.id];
    if (!L2) return;
    L2.blocks.forEach(function(b, bi){
      var t = blockText(b);
      if (t.length < 30) return;
      map[l.id + '|' + bi] = arr.length;
      arr.push({ l: l.id, y: l.year, b: bi, t: t, p: b.k === 'p' ? 1 : 0 });
    });
  });
  TDOCI = map;
  TDOC = arr;
  return arr;
}

function talkEnts(q){
  var hit = [];
  ['concepts', 'companies', 'people'].forEach(function(k){
    C[k].forEach(function(e){ if (q.indexOf(e.name) !== -1) hit.push({ k: k, n: e.name }); });
  });
  hit.sort(function(a, b){ return b.n.length - a.n.length; });
  return hit;
}

function talkRank(q, extraEnts){
  var docs = talkDocs(), terms = talkTerms(q), N = docs.length;
  if (!terms.length) return { picks: [], terms: terms };
  terms.forEach(function(t){
    var df = 0;
    for (var i = 0; i < N; i++) if (docs[i].t.indexOf(t.g) !== -1) df++;
    t.idf = Math.log(1 + N / (df + 1));
  });
  var scored = [];
  for (var i = 0; i < N; i++){
    var t = docs[i].t, s = 0;
    for (var k = 0; k < terms.length; k++){
      var tm = terms[k], p = t.indexOf(tm.g), c = 0;
      if (p < 0) continue;
      while (p >= 0 && c < 4){ c++; p = t.indexOf(tm.g, p + tm.g.length); }
      s += tm.idf * tm.w * (1 + Math.log(c));
    }
    if (s <= 0) continue;
    s = s / (1 + Math.log(1 + t.length / 140));
    /* 附录里「（5）简单易懂的商业模式…，」这种条目是清单的一段，不是完整句子，
       当"最接近的原文"读起来很别扭。稍微压一压，让说完整话的段落优先。 */
    if (/^[（(]\s*\d+\s*[)）]/.test(t) || !/[。！？…”」』]$/.test(t)) s *= .82;
    s += docs[i].p * .35;
    scored.push({ i: i, s: s });
  }
  /* 问题里点名的实体，把它的出场段落直接拎上来，比字面分数可靠 */
  var ents = (extraEnts || []).concat(talkEnts(q));
  var boost = {};
  ents.forEach(function(e){
    (C.mentions[e.n] || []).forEach(function(m){
      var idx = TDOCI[m[2] + '|' + m[1]];
      if (idx != null) boost[idx] = 1;
    });
  });
  var byIdx = {};
  scored.forEach(function(x){ byIdx[x.i] = x.s; if (boost[x.i]) x.s += 8; });
  Object.keys(boost).forEach(function(k){
    var idx = +k;
    if (byIdx[idx] == null) scored.push({ i: idx, s: 8 });
  });
  scored.sort(function(a, b){ return b.s - a.s; });

  var picks = [], per = {};
  function take(skipSeen){
    for (var j = 0; j < scored.length && picks.length < 4; j++){
      var d = docs[scored[j].i];
      if (skipSeen && TALK.seen[d.l + '|' + d.b]) continue;
      if ((per[d.l] || 0) >= 2) continue;      // 同一封信最多两段，避免一段话翻来覆去
      per[d.l] = (per[d.l] || 0) + 1;
      picks.push({ doc: d, s: scored[j].s });
    }
  }
  take(true);
  /* 追问时如果新段落不够，旧段落再补 —— 总比答"找不到"强 */
  if (picks.length < 2){ per = {}; take(false); }
  return { picks: picks, terms: terms };
}

/* 从问题里挑一个能拿去全文检索的关键词。
   不能直接拿整句：「你怎么看科技股」原样丢进检索框，几乎什么都搜不到；
   要的是那几个真正有信息量的字（科技股）。按 权重 × 稀有度 × 长度 挑最大的。 */
function talkKey(terms){
  var best = '', bs = -1;
  (terms || []).forEach(function(t){
    var g = t.g || '';
    /* 带虚词的片段一律不要：「你怎么看科技股」整句也是一个词，稀有度极高，
       一算就压过「科技股」，可拿去检索几乎什么都搜不到。 */
    if (g.length < 2 || g.length > 6) return;
    for (var i = 0; i < g.length; i++) if (TSTOP.indexOf(g.charAt(i)) >= 0) return;
    var s = (t.w || 1) * (t.idf || 1) * (1 + (g.length - 2) * 0.35);
    if (s > bs){ bs = s; best = g; }
  });
  return best;
}

function talkSnip(t, q, terms){
  var p = t.indexOf(q);
  if (p < 0) for (var i = 0; i < terms.length; i++){ p = t.indexOf(terms[i].g); if (p >= 0) break; }
  if (p < 0) p = 0;
  var start = Math.max(0, p - 80), end = Math.min(t.length, start + 230);
  var s = t.slice(start, end).replace(/\s+/g, ' ');
  return (start > 0 ? '…' : '') + s + (end < t.length ? '…' : '');
}

function talkQuote(d, text){
  TALK.seen[d.l + '|' + d.b] = 1;
  return '<div class="tq">' + esc(text) +
    '<span class="src">' + d.y + ' 年 · <a href="#/l/' + encodeURIComponent(d.l) + '?b=' + d.b + '">读原文 ↗</a></span></div>';
}

function talkAnswer(q){
  var qq = String(q).trim();
  var ents = talkEnts(qq), ent = ents[0];

  if (qq.length <= 12 && /(谢谢|多谢|感谢)/.test(qq)) return '<p>不客气。想接着问就接着问。</p>';

  if (qq.length <= 14 && /^(你好|您好|hi|hello|嗨|在吗)/i.test(qq)){
    return '<p>你好。我不替巴菲特编话——只把他在 98 封信里真正写过的段落找出来，附上年份和段落号。</p>' +
      '<p>可以问一个概念（安全边际、能力圈）、一家公司（可口可乐、盖可保险），或者一个年份（1987 年股灾）。</p>';
  }

  if (/(你能做什么|能干什么|会什么|怎么用)/.test(qq)){
    return '<p>我做三件事：</p><p>1. 概念或公司：把他跨年说过的话按时间排给你，附完整档案入口；<br>' +
      '2. 大白话提问：在 98 封信里找最接近的段落，最多给 4 段；<br>' +
      '3. 每条都带年份和段落号，点「读原文 ↗」直接跳到那一页。</p>' +
      '<p>找不到就直说找不到，不会替他把话补完。</p>';
  }

  /* 概念：有档案就用档案摘要 + 原文段落 */
  if (ent && ent.k === 'concepts' && CT.concepts[ent.n]){
    var spec = CT.concepts[ent.n];
    var ms = C.mentions[ent.n] || [];
    var years = ms.map(function(m){ return m[0]; });
    var h = '<p>「<b>' + esc(ent.n) + '</b>」在信里出现过 <b>' + fmt(ms.length + (C.overflow[ent.n] || 0)) + '</b> 次' +
      (years.length ? '，从 ' + Math.min.apply(null, years) + ' 到 ' + Math.max.apply(null, years) : '') + '。</p>';
    var rk = talkRank(qq, ents);
    rk.picks.slice(0, 2).forEach(function(p){ h += talkQuote(p.doc, talkSnip(p.doc.t, talkClean(qq), rk.terms)); });
    var lastP = spec.periods && spec.periods[spec.periods.length - 1];
    if (lastP){
      h += '<div class="talk-sum">档案把这段认识分成 ' + spec.periods.length + ' 段，最近一段（' +
        lastP.y0 + '–' + lastP.y1 + '）的总结：' +
        esc(lastP.text.length > 150 ? lastP.text.slice(0, 150) + '…' : lastP.text) + '</div>';
    }
    h += '<p><a href="#/c/' + encodeURIComponent(ent.n) + '">看「' + esc(ent.n) + '」的完整跨年档案 →</a></p>';
    return h;
  }

  /* 公司：档案里的跨年轨迹 + 两段原文 */
  if (ent && ent.k === 'companies'){
    var co = CT.companies[ent.n] || null;
    var tl = co ? (co.timeline || []) : [];
    var rk2 = talkRank(qq, ents);
    var h2 = '<p>「<b>' + esc(ent.n) + '</b>」原文出场 <b>' + fmt((C.mentions[ent.n] || []).length + (C.overflow[ent.n] || 0)) + '</b> 段' +
      (tl.length ? '，人工档案里有 <b>' + tl.length + '</b> 条跨年记录（' + tl[0].y + '–' + tl[tl.length - 1].y + '）' : '') + '。</p>';
    rk2.picks.slice(0, 2).forEach(function(p){ h2 += talkQuote(p.doc, talkSnip(p.doc.t, talkClean(qq), rk2.terms)); });
    h2 += '<p><a href="#/co/' + encodeURIComponent(ent.n) + '">看「' + esc(ent.n) + '」的跨年轨迹 →</a></p>';
    return h2;
  }

  /* 认错：这类问题字面检索容易翻到「不是我的错」之类的段落，
     直接改走人工整理的认错档案，挑他最直白承认的几条 */
  if (!ent && /(错误|认错|失误|教训|后悔|糟糕)/.test(qq)){
    var cs2 = (CT.corrections || []).filter(function(c){ return /(错|失误|教训|后悔|糟糕)/.test(c.t); });
    function cw(c){
      var s = 0;
      if (/最(大|糟|严重|惨)/.test(c.t)) s += 3;
      if (/德克斯特|纺织|通用再保险/.test(c.t)) s += 2;   // 他自己反复点名的三大错
      if (/我(犯|做|买|付)/.test(c.t)) s += 1;
      if (c.k === 'error') s += 1;
      return s * 10 + Math.max(0, c.y - 1980) / 10;
    }
    cs2.sort(function(a, b){ return cw(b) - cw(a) || b.y - a.y; });
    if (cs2.length){
      var h4 = '<p>他公开认过的错不少，最直白的几段是：</p>';
      cs2.slice(0, 3).forEach(function(c){
        h4 += '<div class="tq">' + esc(c.t) +
          '<span class="src">' + c.y + ' 年 · <a href="#/l/' + encodeURIComponent(c.loc.l) + '?b=' + c.loc.b + '">读原文 ↗</a></span></div>';
      });
      h4 += '<p><a href="#/corr">看完整的 ' + (CT.corrections || []).length + ' 条认错档案 →</a></p>';
      return h4;
    }
  }

  /* 其余：纯原文检索；追问「他后来呢」时沿用上一轮的话题和实体 */
  var follow = '';
  if (!ent && TALK.lastEnt && qq.length <= 24 && /(他|它|这个|那个|后来|还有|再|呢)/.test(qq)) follow = TALK.lastEnt;
  var extra = follow ? [{ n: follow }] : [];
  var baseQ = (follow && TALK.lastQ) ? (TALK.lastQ + ' ' + qq) : qq;
  var rk3 = talkRank(baseQ + (follow ? ' ' + follow : ''), extra);
  if (!rk3.picks.length){
    return '<p>这句话我在 98 封信里没找到对应的段落。换个说法试试，或者直接搜关键词。</p>' +
      '<div class="tp-topics" style="max-width:540px;margin:12px 0 0">' + talkTopics() + '</div>';
  }
  var h3 = (follow ? '<p class="talk-follow">接着上面「' + esc(follow) + '」继续说：</p>' : '') +
    '<p>找到 ' + rk3.picks.length + ' 段最接近的原文：</p>';
  rk3.picks.forEach(function(p){ h3 += talkQuote(p.doc, talkSnip(p.doc.t, talkClean(qq), rk3.terms)); });
  var kw = talkKey(rk3.terms) || talkClean(qq) || qq;
  h3 += '<p><a href="#/q/' + encodeURIComponent(kw) + '">在全文检索里继续找「' + esc(kw) + '」→</a></p>';
  return h3;
}

function talkTopics(){
  var qs = ['你怎么看科技股？', '什么是安全边际？', '你怎么看通货膨胀？', '你犯过最大的错误是什么？'];
  return qs.map(function(q, i){
    return '<button class="tp-topic" data-q="' + esc(q) + '"><b>话题 ' + (i + 1) + '</b><span>' + esc(q) + '</span></button>';
  }).join('');
}

function talkMsgs(){
  return TALK.msgs.map(function(m, i){
    if (m.r === 'u') return '<div class="msg u"><div class="bubble">' + esc(m.t) + '</div></div>';
    var steps = (m.steps && m.steps.length)
      ? '<div class="tp-steps' + (m.live ? ' live' : '') + '">' +
        m.steps.map(function(s){ return '<div>· ' + esc(s) + '</div>'; }).join('') + '</div>'
      : '';
    /* 本地兜引擎给的是现成 HTML（m.h），agent 给的是待排版的原文（m.raw） */
    var body;
    if (m.live && !m.raw && !m.h) body = '<p class="ttyping">正在想一想该从哪儿翻起…</p>';
    else if (m.h) body = m.h;
    else body = fmtAns(m.raw || '') + (m.live ? '<span class="tp-caret"></span>' : '');
    return '<div class="msg b" id="tm-' + i + '"><div class="ava">' + cupSVG(16) + '</div>' +
      '<div class="bubble">' + steps + body + fmtSrcs(m.sources || []) + fmtMeta(m) + '</div></div>';
  }).join('');
}

/* 回答里的行内标记：[[1964 巴菲特致合伙人信|101]] 变成能点回原文的胶囊，
   [[web|网址]] 变成网络来源胶囊。引文用 > 起头，加粗用 **。 */
function fmtCite(s){
  return s.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, function(all, a, b){
    if (a === 'web') return '<a class="ct-cite ct-web" href="' + b.replace(/&amp;/g, '&') +
      '" target="_blank" rel="noopener">网络来源 ↗</a>';
    var y = (a.match(/\d{4}/) || [''])[0];
    return '<a class="ct-cite" href="#/l/' + encodeURIComponent(a) + '?b=' + encodeURIComponent(b) + '">' +
      y + ' 年 · 读原文 ↗</a>';
  });
}
function fmtAns(t){
  var out = '', quote = false;
  String(t).split('\n').forEach(function(ln){
    var s = ln.replace(/\s+$/, '');
    if (/^\s*>\s?/.test(s)){
      if (!quote){ out += '<blockquote>'; quote = true; }
      else out += '<br>';
      out += fmtCite(esc(s.replace(/^\s*>\s?/, '')));
      return;
    }
    if (quote){ out += '</blockquote>'; quote = false; }
    var tr = s.trim();
    if (!tr) return;
    /* 模型时不时把小标题写成 ## 的形式，原样显示会很业余，去掉井号并加粗 */
    var head = /^#{1,4}\s?/.test(tr);
    if (head) tr = tr.replace(/^#{1,4}\s?/, '');
    if (/^[-*]\s/.test(tr)) tr = tr.replace(/^[-*]\s/, '· ');
    var line = fmtCite(esc(tr)).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    out += head ? '<p class="tp-h">' + line + '</p>' : '<p>' + line + '</p>';
  });
  if (quote) out += '</blockquote>';
  return out;
}
/* 花了多少、查了几轮，摆在答案底下：接的是要花钱的模型，读者有权知道 */
function fmtMeta(m){
  if (!m) return '';
  var bits = [];
  if (m.rounds) bits.push('这一答他自己查了 ' + m.calls + ' 次资料、' + m.rounds + ' 轮');
  if (m.usage && m.usage.total_tokens) bits.push('用了 ' + fmt(m.usage.total_tokens) + ' tokens');
  if (!bits.length) return '';
  return '<div class="tp-meta">' + bits.join(' · ') + '</div>';
}
function fmtSrcs(list){
  if (!list || !list.length) return '';
  return '<div class="tp-srcs"><b>这一答引用的出处（' + list.length + ' 条）</b>' +
    list.map(function(s){
      if (s.kind === 'letter'){
        return '<a href="#/l/' + encodeURIComponent(s.l) + '?b=' + s.b + '">' + s.y + ' 年 · ' + esc(s.l) + ' 第 ' + s.b + ' 段</a>';
      }
      var host = '';
      try { host = s.url.split('/')[2] || ''; } catch (e) {}
      return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">网络 · ' + esc(host) + ' — ' + esc(String(s.title || '').slice(0, 46)) + '</a>';
    }).join('') + '</div>';
}

/* 本地服务的地址：页面如果就是它自己托管的，用相对路径；
   双击 html（file://）打开的，就直奔 127.0.0.1:8099。 */
var TM = { online: null, base: '', model: 'flash', web: true, ctrl: null, probing: false };
function talkBase(){
  if (TM.base) return TM.base;
  TM.base = (location.protocol === 'http:' || location.protocol === 'https:') ? '' : 'http://127.0.0.1:8099';
  return TM.base;
}
function talkProbe(){
  if (TM.probeP) return TM.probeP;
  var seen = {}, tries = [];
  [talkBase(), 'http://127.0.0.1:8099'].forEach(function(b){ if (!seen[b]){ seen[b] = 1; tries.push(b); } });
  var n = 0;
  function attempt(){
    if (n >= tries.length){
      TM.online = false;
      if (route() === '/talk') talkUpdateState();
      return Promise.resolve(false);
    }
    var b = tries[n++];
    return fetch(b + '/api/health', { cache: 'no-store' }).then(function(r){ return r.json(); })
      .then(function(j){
        if (j && j.ok && j.key){ TM.base = b; TM.online = true; if (route() === '/talk') talkUpdateState(); return true; }
        return attempt();
      })
      .catch(function(){ return attempt(); });
  }
  /* 探活不能无限等：最多 3 秒，超时就按离线处理，界面照常能用 */
  TM.probeP = new Promise(function(res){
    var timer = setTimeout(function(){ res(false); }, 3000);
    attempt().then(function(ok){ clearTimeout(timer); res(ok); });
  });
  return TM.probeP;
}

/* 探活是异步的，结果回来时不能整页 render：那会把别人手里正在点的链接换成 0×0 的幽灵
   （全站审计就是这么报出一条「#/talk 上的返回链接尺寸为 0」）。只改那两处文字。 */
function talkStateText(){
  return TM.online === true ? '已连接本地 Agent'
    : TM.online === null ? '正在探活…' : '离线模式（关键词检索）';
}
function talkHeroP(){
  if (TM.online === true) return '这是个会自己去查资料的 agent：他会在 98 封信里翻找，必要时上网核实，' +
    '每句话都标出来处。不知道问什么？试试这些话题';
  if (TM.online === null) return '正在连本地 Agent 服务…';
  return '本地 Agent 服务没起来，现在是关键词检索模式。<br>想让他真会查资料、会联网，双击项目里的 <b>start.bat</b>。';
}
function talkUpdateState(){
  var s = document.querySelector('.tp-state');
  if (s){
    s.className = 'tp-state ' + (TM.online === true ? 'on' : 'off');
    s.innerHTML = '<i class="dot"></i>' + talkStateText();
  }
  var hp = document.querySelector('.tp-hero p');
  if (hp) hp.innerHTML = talkHeroP();
}

function talkPage(){
  var online = TM.online === true;
  var body = TALK.msgs.length ? talkMsgs()
    : '<div class="tp-hero"><div class="tp-cup">' + cupSVG(46) + '</div>' +
      '<p>' + talkHeroP() + '</p><div class="tp-topics">' + talkTopics() + '</div></div>';
  var state = '<span class="tp-state ' + (online ? 'on' : 'off') + '"><i class="dot"></i>' + talkStateText() + '</span>';
  return '<div class="talk-page">' +
    '<div class="tp-head"><div class="tp-brand">' + cupSVG(22) + '巴菲特午餐会' + state + '</div>' +
      '<a class="tp-back" href="#/">← 返回知识库</a></div>' +
    '<div class="tp-sub">拉把椅子，听老先生慢慢讲投资与人生 · 关于他本人说过什么，只回答查得到出处的部分</div>' +
    '<div id="talk-body">' + body + '</div>' +
    /* 输入框和它下面那排开关要一起粘在底部：单独粘输入框的话，
       长答案滚到一半时开关就被挤出视口，等于没有。 */
    '<div class="tp-bar">' +
      '<div class="tp-composer">' +
        '<button class="tp-new" id="talk-new">+ 新对话</button>' +
        '<input id="talk-in" type="text" autocomplete="off" placeholder="请教巴菲特一个问题…" value="' + esc(TALK.draft) + '">' +
        '<button class="tp-send" id="talk-send">提问</button>' +
      '</div>' +
      '<div class="tp-opts">' +
        '<label><input type="checkbox" id="talk-web"' + (TM.web ? ' checked' : '') + '> 允许联网核实（信件之外的事才用）</label>' +
        '<label><input type="checkbox" id="talk-pro"' + (TM.model === 'pro' ? ' checked' : '') + '> 深思模式（更慢、更细）</label>' +
        '<button class="tp-stop" id="talk-stop" style="display:none">停止</button>' +
      '</div>' +
    '</div>' +
    '<p class="tp-note">回答基于巴菲特公开信件整理，不构成任何投资建议。' +
      (online ? '每条引文都能点回原信。' : '离线模式只在字面上匹配原文，不含推理。') + '</p>' +
    '<p class="tp-mem">他会慢慢记住你是谁、关心什么（存在本机的 agent-memory.json 里）· ' +
      '<button id="talk-forget">让他忘掉关于我的一切</button></p>' +
  '</div>';
}

/* ---------- 提问 ----------
   两条路：联得上本地服务就走 agent（会自己调工具、自己查几轮、自己记笔记）；
   联不上就退回页面内的关键词检索，并且在界面上明说是离线模式 —— 不装。 */
function talkAsk(q){
  q = String(q || '').trim();
  if (!q || TALK.busy) return;
  TALK.busy = true;
  TALK.draft = '';
  TALK.msgs.push({ r: 'u', t: q });
  TALK.msgs.push({ r: 'b', raw: '', steps: [], sources: [], live: true });
  var idx = TALK.msgs.length - 1;
  render();
  talkScroll();

  if (TM.online !== true){
    talkProbe();
    /* 探活是异步的，先把这次当离线答；下次进来就是 agent 了 */
    talkLocalFallback(q, idx);
    return;
  }
  talkStream(q, idx);
}

/* 关键词检索兜底：没有任何 AI，纯字面匹配，界面上会如实标注 */
function talkLocalFallback(q, idx){
  setTimeout(function(){
    var a;
    try { a = talkAnswer(q); }
    catch (e) { a = '<p>检索时出了点问题：' + esc(e && e.message ? e.message : '未知错误') + '</p>'; }
    TALK.msgs[idx] = { r: 'b', h: a };
    var e2 = talkEnts(q)[0];
    if (e2) TALK.lastEnt = e2.n;
    TALK.lastQ = e2 ? e2.n : q;
    TALK.busy = false;
    /* 人可能已经点走了：答案留在 TALK.msgs 里，等回到对话页再看，
       绝不在这里重绘 —— 否则会把别的页面整个换掉、还把人滚回顶部 */
    if (route() === '/talk'){
      render();
      talkScroll();
    }
  }, 40);
}

function talkScroll(){
  if (route() !== '/talk') return;
  var last = document.querySelector('#talk-body .msg:last-child');
  if (last) last.scrollIntoView({ block: 'end' });
}

/* 只重画这一条气泡，不整页 render —— 流式打字时整页重绘会把输入框的光标弄丢 */
function talkPaint(idx){
  if (route() !== '/talk') return;
  var m = TALK.msgs[idx];
  if (!m) return;
  var root = document.getElementById('tm-' + idx);
  if (!root) return;
  var steps = root.querySelector('.tp-steps');
  var box = root.querySelector('.bubble');
  if (!box) return;
  var html = '';
  if (m.steps && m.steps.length){
    html += '<div class="tp-steps' + (m.live ? ' live' : '') + '">' +
      m.steps.map(function(s){ return '<div>· ' + esc(s) + '</div>'; }).join('') + '</div>';
  }
  html += m.live && !m.raw ? '<p class="ttyping">正在想一想该从哪儿翻起…</p>'
    : fmtAns(m.raw || '') + (m.live ? '<span class="tp-caret"></span>' : '');
  html += fmtSrcs(m.sources || []) + fmtMeta(m);
  box.innerHTML = html;
  talkScroll();
}

function talkStream(q, idx){
  var stop = document.getElementById('talk-stop');
  if (stop) stop.style.display = 'inline-block';
  TM.ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  fetch(talkBase() + '/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: q, session: TALK.session, web: TM.web, model: TM.model }),
    signal: TM.ctrl ? TM.ctrl.signal : undefined
  }).then(function(res){
    if (!res.ok) throw new Error('本地服务返回 ' + res.status);
    var reader = res.body.getReader(), dec = new TextDecoder(), buf = '', ev = '';
    function pump(){
      return reader.read().then(function(r){
        if (r.done){ talkFinish(idx, null); return; }
        buf += dec.decode(r.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop();
        lines.forEach(function(line){
          if (line.indexOf('event: ') === 0){ ev = line.slice(7).trim(); return; }
          if (line.indexOf('data: ') !== 0) return;
          var d = null;
          try { d = JSON.parse(line.slice(6)); } catch (e) { return; }
          talkEvent(ev, d, idx);
        });
        return pump();
      });
    }
    return pump();
  }).catch(function(e){
    if (e && e.name === 'AbortError'){ talkFinish(idx, '已停止'); return; }
    /* 服务掉了：这一问退回本地检索，并且把状态标成离线 */
    TM.online = false;
    TALK.msgs[idx] = { r: 'b', h: '<p>连不上本地 Agent 服务了（' + esc(e && e.message ? e.message : '未知原因') + '）。' +
      '这一问先按关键词检索作答：</p>' };
    try {
      TALK.msgs[idx].h = '<p>连不上本地 Agent 服务。这一问先按关键词检索作答：</p>' + talkAnswer(q);
    } catch (e2) { TALK.msgs[idx].h += '<p>（本地检索也失败了）</p>'; }
    talkFinish(idx, null);
  });
}

function talkEvent(ev, d, idx){
  var m = TALK.msgs[idx];
  if (!m) return;
  if (ev === 'step'){ m.steps.push(d.text); talkPaint(idx); }
  else if (ev === 'delta'){ m.raw += d.text; talkPaint(idx); }
  else if (ev === 'reset'){ m.raw = ''; talkPaint(idx); }   // 这一轮它改主意去查工具了，刚才那半句不算答案
  else if (ev === 'sources'){ m.sources = d.sources || []; talkPaint(idx); }
  else if (ev === 'note'){ m.note = d.text; }
  else if (ev === 'error'){ talkFinish(idx, d.message); }
  else if (ev === 'usage'){ m.usage = d; }
  else if (ev === 'done'){
    m.rounds = d.rounds; m.calls = d.calls;
    talkFinish(idx, null);
  }
}

function talkFinish(idx, err){
  var m = TALK.msgs[idx];
  if (m){
    m.live = false;
    if (err) m.err = err;
    /* 只有写坏的标记（缺竖线的那种）才删掉，正常的 [[信|段]] 要留着 ——
       它们正是页面上那些能点回原文的胶囊，删了就一颗不剩了。 */
    m.raw = String(m.raw || '').replace(/\[\[[^\]|]*\]\]/g, '');
    if (m.note) m.raw += '\n\n> ' + m.note;
    if (err) m.raw += '\n\n> ' + err;
  }
  TALK.busy = false;
  var stop = document.getElementById('talk-stop');
  if (stop) stop.style.display = 'none';
  if (route() === '/talk'){ talkPaint(idx); }
}

/* ---------- 路由 ---------- */
/* 同一条路由内的重绘（提问、搜索框输入）不该把页面拉回顶部；
   只有真正换页才回顶。否则在长信里打字、在对话页等回答，都会被弹回开头。 */
var LASTROUTE = null;
function render(){
  var hx = route();
  var sameRoute = (hx === LASTROUTE);
  var app = document.getElementById('app');
  var p = hx.split('/');
  var html = '';
  if (p[1] === 'l') html = letter(dec(p.slice(2).join('/')));
  else if (p[1] === 'y' && p[2]){
    var yy = +p[2];
    // 年份必须是合理数字，否则 #/y/abc 会渲染出一个"abc 年不在收录范围"的怪页面
    html = (yy >= 1800 && yy <= 2200) ? yearPage(yy) : notFound('年份', dec(p[2]));
  }
  else if (p[1] === 'e' && p[2]) html = entity(p[2], dec(p.slice(3).join('/')));
  else if (p[1] === 'c' && p[2]) html = conceptPage(dec(p.slice(2).join('/')));
  else if (p[1] === 'co' && p[2]) html = companyPage(dec(p.slice(2).join('/')));
  else if (p[1] === 'concept') html = concepts();
  else if (p[1] === 'corr') html = corr();
  else if (p[1] === 'rules') html = rules();
  else if (p[1] === 'score') html = score();
  else if (p[1] === 'decide') html = decide();
  else if (p[1] === 'letters') html = lettersPage();
  else if (p[1] === 'ents') html = ents();
  else if (p[1] === 'talk') html = talkPage();
  else if (p[1] === 'q' && p[2]) html = searchPage(dec(p.slice(2).join('/')));
  else if (!p[1]) html = home();
  else html = notFound('页面', dec(p.slice(1).join('/')));
  var shellCls = p[1] ? 'app-page' : 'app-home';
  if (p[1] === 'l') shellCls += ' app-read';
  try { app.setAttribute('class', shellCls); } catch (e) { try { app.className = shellCls; } catch (e2) {} }
  app.innerHTML = html;
  markNav();
  bind();
  /* 首页那三条示例问题带 ?q= 进来，落地就替用户问出去（同一句只自动问一次） */
  if (p[1] === 'talk'){
    talkProbe();          // 探一下本地 Agent 在不在，决定这一页是走 agent 还是走离线检索
    var qm = location.hash.match(/[?&]q=([^&]*)/);
    if (qm){
      var autoQ = dec(qm[1]);
      if (autoQ && TALK.asked !== autoQ){
        TALK.asked = autoQ;
        /* 60ms 里人可能已经点走了。talkAsk 一进来就 render()，不判一下的话
           会把用户正看着的那一页整个重画：光标丢、滚动位置丢，元素引用也全作废
           （审计里就是这样把「正在点的那个链接」换成 0×0 的幽灵，误报遮挡）。
           另外这一问必须等探活结束：不然会因为 online 还是未知而降级成关键词检索。 */
        setTimeout(function(){
          if (route() !== '/talk') return;
          talkProbe().then(function(){ if (route() === '/talk') talkAsk(autoQ); });
        }, 60);
      }
    }
  }
  /* 全站开了 smooth 滚动，若沿用会把"切页回顶"变成一段动画，
     中途看起来像没跳转。切页这一下必须瞬时归零。 */
  if (!sameRoute){
    var de = document.documentElement, sbv = de.style.scrollBehavior;
    de.style.scrollBehavior = 'auto';
    window.scrollTo(0, 0);
    de.style.scrollBehavior = sbv;
  }
  LASTROUTE = hx;
}

function bind(){
  var tin = document.getElementById('talk-in');
  if (tin){
    tin.oninput = function(){ TALK.draft = tin.value; };
    tin.onkeydown = function(ev){ if (ev.key === 'Enter'){ ev.preventDefault(); talkAsk(tin.value); } };
    document.getElementById('talk-send').onclick = function(){ talkAsk(tin.value); };
    document.getElementById('talk-new').onclick = function(){
      TALK.msgs = []; TALK.draft = ''; TALK.lastEnt = ''; TALK.lastQ = ''; TALK.asked = ''; TALK.seen = {};
      /* 换会话 = 换一段新的上下文，但长期记忆是跨会话的，不清 */
      TALK.session = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      render();
    };
    document.querySelectorAll('.tp-topic').forEach(function(el){
      el.onclick = function(){ talkAsk(el.dataset.q); };
    });
    var tw = document.getElementById('talk-web');
    if (tw) tw.onchange = function(){ TM.web = !!tw.checked; };
    var tp = document.getElementById('talk-pro');
    if (tp) tp.onchange = function(){ TM.model = tp.checked ? 'pro' : 'flash'; };
    var ts = document.getElementById('talk-stop');
    if (ts) ts.onclick = function(){
      if (TM.ctrl) TM.ctrl.abort();
      else { TALK.busy = false; ts.style.display = 'none'; }
    };
    var tf = document.getElementById('talk-forget');
    if (tf) tf.onclick = function(){
      fetch(talkBase() + '/api/memory', { method: 'DELETE' }).then(function(){
        tf.parentNode.innerHTML = '已经让他忘掉关于你的一切了。';
      }).catch(function(){
        tf.parentNode.innerHTML = '清不掉（本地服务没起来），记忆还在 agent-memory.json 里。';
      });
    };
  }
  document.querySelectorAll('.yr').forEach(function(el){
    el.onclick = function(){ go('#/y/' + el.dataset.y); };
  });
  document.querySelectorAll('.feat[data-f]').forEach(function(el){
    el.onclick = function(){
      var t = el.dataset.f;
      if (t === '记分牌') go('#/score');
      else if (t === '决策卡') go('#/decide');
      else if (t === '实体跨年追踪') go('#/ents');
      else go('#/l/' + encodeURIComponent('1988 巴菲特致股东信'));
    };
  });
  // 入门导引：点卡片 -> 进该路径第一个概念, 没有则跳到导引第一个年份的信
  document.querySelectorAll('.pcard').forEach(function(el){
    el.onclick = function(){
      var p = null;
      (CT.paths || []).forEach(function(x){ if (x.id === el.dataset.p) p = x; });
      if (!p) return;
      if ((p.concepts || []).length) go('#/c/' + encodeURIComponent(p.concepts[0]));
      else if ((p.years || []).length) openYear(p.years[0]);
    };
  });
  // 公司页年份轴：点年份滚到对应行
  document.querySelectorAll('.ax.on').forEach(function(el){
    el.onclick = function(){
      var y = el.dataset.cy;
      var rows = document.querySelectorAll('.trow');
      for (var i = 0; i < rows.length; i++){
        var ty = rows[i].querySelector('.ty');
        if (ty && ty.textContent.indexOf(y) === 0){
          rows[i].scrollIntoView({block:'center'});
          rows[i].style.background = 'var(--accent-soft)';
          return;
        }
      }
    };
  });
  // 规则库搜索
  var rq = document.getElementById('rq');
  if (rq){
    rq.oninput = function(){
      ruleQ = rq.value;
      var pos = rq.selectionStart;
      render();
      var r2 = document.getElementById('rq');
      if (r2){ r2.focus(); r2.setSelectionRange(pos, pos); }
    };
    var rc = document.getElementById('rc');
    if (rc) rc.onclick = function(){ ruleQ = ''; render(); };
  }
  // 记分牌公司搜索
  var cq = document.getElementById('cq');
  if (cq){
    cq.oninput = function(){
      coQ = cq.value;
      var pos = cq.selectionStart;
      render();
      var c2 = document.getElementById('cq');
      if (c2){ c2.focus(); c2.setSelectionRange(pos, pos); }
    };
    var cc = document.getElementById('cc');
    if (cc) cc.onclick = function(){ coQ = ''; render(); };
  }
  document.querySelectorAll('.ent').forEach(function(el){
    el.onclick = function(ev){
      if (ev && ev.stopPropagation) ev.stopPropagation();   // 别让外层整块跳转覆盖
      go('#/e/' + el.dataset.k + '/' + encodeURIComponent(el.dataset.e));
    };
  });
  /* 整块可点：点条目任意位置进原文；内部链接优先走自己的目标 */
  document.querySelectorAll('[data-jump]').forEach(function(el){
    el.onclick = function(ev){
      var t = ev && ev.target;
      if (t && (t.tagName === 'A' || (t.parentNode && t.parentNode.tagName === 'A'))) return;
      go(el.dataset.jump);
    };
  });
  document.querySelectorAll('.snip').forEach(function(el){
    el.onclick = function(){ go('#/l/' + encodeURIComponent(el.dataset.go) + '?b=' + el.dataset.b); };
  });
  document.querySelectorAll('.opt[data-d]').forEach(function(el){
    el.onclick = function(){
      picks[el.dataset.d] = +el.dataset.i;
      render();
    };
  });
  var up = document.getElementById('t-up'), dn = document.getElementById('t-dn');
  if (up || dn){
    var id = dec(route().split('/').slice(2).join('/'));
    var idx = C.letters.findIndex(function(l){ return l.id === id; });
    if (up) up.onclick = function(){ if (idx > 0) go('#/l/' + encodeURIComponent(C.letters[idx-1].id)); };
    if (dn) dn.onclick = function(){ if (idx >= 0 && idx < C.letters.length-1) go('#/l/' + encodeURIComponent(C.letters[idx+1].id)); };
  }
  var bnum = hashNum('b');
  if (bnum !== null){
    var t = document.getElementById('b' + bnum);
    if (t){
      t.classList.add('cur');
      /* 长信有两万多像素，60ms 后滚动时下半页可能还没排完版，滚到位又会被顶下去。
         滚完回头量一次，没进视口就再来一遍（最多三次），避免看着像没跳。 */
      var tries = 0;
      (function align(){
        t.scrollIntoView({block:'center'});
        if (++tries >= 3) return;
        setTimeout(function(){
          var r = t.getBoundingClientRect();
          if (r.top < -40 || r.top > window.innerHeight - 80) align();
        }, 240);
      })();
    }
  }
}

/* ================= 侧栏 · 搜索 · 折叠 ================= */
function sgroup(id, title, items, open){
  var h = '<div class="nav-group"><div class="nav-group-title' + (open ? ' open' : '') +
    '" data-g="' + id + '"><span class="caret"></span>' + title +
    '<span class="badge">' + items.length + '</span></div>' +
    '<div class="nav-group-items' + (open ? ' open' : '') + '" id="g_' + id + '">';
  items.forEach(function(it){
    h += '<a href="' + it[0] + '" class="nav-link" data-n="' + it[1] + '" title="' + esc(it[2]) + '">' +
      esc(it[2]) + '</a>';
  });
  return h + '</div></div>';
}
function buildSidebar(){
  var el = document.getElementById('snav');
  if (!el) return;
  var h = '<a href="#/" class="nav-link nav-home" data-n="/">🏛 首页</a>';
  h += '<a href="#/talk" class="nav-link nav-talk" data-n="/talk">☕ 巴菲特午餐会</a>';
  h += '<div class="search-box"><input type="text" id="q" placeholder="搜索信件 / 概念 / 公司…" autocomplete="off">' +
       '<div id="qres"></div></div>';
  h += sgroup('idx', '索引', [
    ['#/letters', '/letters', '全部信件'],
    ['#/ents', '/ents', '实体总览'],
    ['#/score', '/score', '公司记分牌'],
    ['#/concept', '/concept', '术语演化'],
    ['#/corr', '/corr', '认错档案'],
    ['#/rules', '/rules', '规则库'],
    ['#/decide', '/decide', '决策卡']
  ], true);

  function letters(kind){
    return C.letters.filter(function(l){ return l.kind === kind; }).map(function(l){
      return ['#/l/' + encodeURIComponent(l.id), '/l/' + encodeURIComponent(l.id), l.id];
    });
  }
  h += sgroup('partner', '合伙人信', letters('partnership'), false);
  h += sgroup('berk', '伯克希尔股东信', letters('berkshire'), false);
  h += sgroup('special', '特别信件', letters('special'), false);

  function entGroup(kind, label){
    return C[kind].slice().sort(function(a, b){ return entCount(b.name) - entCount(a.name); })
      .map(function(e){
        var href = entHref(e.name) || ('#/e/' + kind + '/' + encodeURIComponent(e.name));
        return [href, href.slice(1), e.name];
      });
  }
  h += sgroup('concept', '概念', entGroup('concepts'), false);
  h += sgroup('company', '公司', entGroup('companies'), false);
  h += sgroup('people', '人物', entGroup('people'), false);
  el.innerHTML = h;
}
function markNav(){
  var cur = (location.hash.slice(1).split('?')[0]) || '/';
  var activeEl = null;
  document.querySelectorAll('#snav .nav-link').forEach(function(a){
    var on = a.getAttribute('data-n') === cur;
    a.classList.toggle('active', on);
    if (on) activeEl = a;
  });
  /* 跳转后侧栏必须给出可见反馈：当前项若在折叠分组里，展开它并滚到可见，
     否则用户看不出页面已经换了（会被当成“点了没反应”） */
  if (activeEl){
    var items = activeEl.parentNode;
    if (items && items.classList && items.classList.contains('nav-group-items') && !items.classList.contains('open')){
      items.classList.add('open');
      var t = document.querySelector('.nav-group-title[data-g="' + items.id.slice(2) + '"]');
      if (t) t.classList.add('open');
    }
    try { activeEl.scrollIntoView({block:'nearest'}); } catch(e){}
  }
}
function wireGroups(){
  document.querySelectorAll('#snav .nav-group-title').forEach(function(t){
    t.onclick = function(){
      var g = document.getElementById('g_' + t.getAttribute('data-g'));
      if (!g) return;
      var on = !g.classList.contains('open');
      g.classList.toggle('open', on);
      t.classList.toggle('open', on);
    };
  });
}
var qTimer;
function doSearch(q, box){
  q = (q || '').trim();
  if (!q){ box.setAttribute('class', ''); box.innerHTML = ''; return; }
  var res = [], seen = {};
  function push(o){ if (seen[o.href]) return; seen[o.href] = 1; res.push(o); }
  [['companies', '公司', C.companies], ['concepts', '概念', C.concepts], ['people', '人物', C.people]].forEach(function(g){
    g[2].forEach(function(e){
      if (e.name.indexOf(q) !== -1 ||
          (e.en && e.en.toLowerCase().indexOf(q.toLowerCase()) !== -1)){
        push({href: entHref(e.name) || '#/ents', t: e.name, ty: g[1],
              s: (e.summary || e.en || '').slice(0, 58)});
      }
    });
  });
  C.letters.forEach(function(l){
    if (l.id.indexOf(q) !== -1){
      push({href: '#/l/' + encodeURIComponent(l.id), t: l.id, ty: '信件',
            s: l.n + ' 段 · ' + (l.chars / 1000).toFixed(1) + ' 千字'});
    }
  });
  var hit = 0;
  for (var id in L){
    if (hit >= 6) break;
    var bs = L[id].blocks;
    for (var i = 0; i < bs.length; i++){
      var tx = blockText(bs[i]);
      var pp = tx.indexOf(q);
      if (pp !== -1){
        push({href: '#/l/' + encodeURIComponent(id) + '?b=' + i, t: id, ty: '原文',
              s: (pp > 22 ? '…' : '') + tx.slice(Math.max(0, pp - 22), pp + 48) + '…'});
        hit++;
        break;
      }
    }
  }
  var out = '';
  res.slice(0, 14).forEach(function(r){
    out += '<a class="sr-item" href="' + r.href + '"><span class="sr-title">' + esc(r.t) + '</span>' +
      '<span class="sr-type">' + r.ty + '</span>' +
      '<span class="sr-snippet">' + esc(r.s) + '</span></a>';
  });
  out += '<a class="sr-all" href="' + searchHref(q) + '">看「' + esc(q) + '」的全部结果 →</a>';
  box.innerHTML = out;
  box.setAttribute('class', 'on');
}
function wireSearch(){
  var q = document.getElementById('q'), box = document.getElementById('qres');
  if (!q || !box) return;
  q.oninput = function(){
    clearTimeout(qTimer);
    qTimer = setTimeout(function(){ doSearch(q.value, box); }, 130);
  };
  q.onkeydown = function(ev){
    if (!ev) return;
    if (ev.key === 'Escape'){ q.value = ''; box.setAttribute('class', ''); }
    if (ev.key === 'Enter'){
      var a = box.querySelector('.sr-item');
      if (a) go(a.getAttribute('href'));
    }
  };
  box.onclick = function(ev){
    if (ev && ev.target && ev.target.tagName === 'A') box.setAttribute('class', '');
  };
}
(function shellInit(){
  try {
    buildSidebar();
    wireGroups();
    wireSearch();
    var hb = document.getElementById('hamb'), sb = document.getElementById('sidebar'), sc = document.getElementById('scrim');
    if (hb && sb && sc){
      hb.onclick = function(){ sb.classList.toggle('open'); sc.classList.toggle('on'); };
      sc.onclick = function(){ sb.classList.remove('open'); sc.classList.remove('on'); };
      sb.onclick = function(ev){
        if (ev && ev.target && ev.target.tagName === 'A'){
          sb.classList.remove('open'); sc.classList.remove('on');
        }
      };
    }
  } catch (e) {}
})();

var fcEl = document.getElementById('foot-chars');
if (fcEl) fcEl.textContent = fmt(TOTCHARS);

window.onhashchange = render;

/* 同址链接再点一次不该没反应：地址没变不会触发 hashchange。
   带 ?b= 的直接滚回那一段，其余重画一页。 */
if (document.addEventListener) document.addEventListener('click', function(ev){
  var a = ev.target;
  while (a && a !== document.body && a.tagName !== 'A') a = a.parentNode;
  if (!a || a.tagName !== 'A') return;
  var href = a.getAttribute('href');
  if (!href || href.charAt(0) !== '#') return;
  var same = href === location.hash || (href === '#/' && (location.hash === '' || location.hash === '#'));
  if (!same) return;
  ev.preventDefault();
  var m = href.match(/[?&]b=(\d+)/);
  if (m){
    var t = document.getElementById('b' + m[1]);
    if (t){ t.scrollIntoView({block: 'center'}); return; }
  }
  render();
}, false);

render();

/* 数据到位、首屏画完才撤掉加载提示 */
(function(){
  var b = document.getElementById('boot');
  if (!b) return;
  try { b.parentNode.removeChild(b); } catch (e) { b.style.display = 'none'; }
})();
</script>
