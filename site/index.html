<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>读巴菲特 · 1956–2025 股东信知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF7F2;--bg2:#F3EDE4;--panel:#FFFFFF;--card:#FFFFFF;
  --text:#1B1B18;--ink:#1B1B18;--ink2:#6B6560;--ink3:#9A938A;
  --gold:#B8860B;--gold-light:#D4A843;--gold-glow:rgba(184,134,11,.12);
  --navy:#1A2332;--navy-light:#2C3E50;--cream:#FFF8EE;
  --border:#E0D6C8;--line:#E0D6C8;--line2:#D3C6B4;
  --accent:#B8860B;--accent-soft:#FFF8EE;--link:#8B5E0B;
  --hit:#3b6d11;--hit-soft:#eaf3de;--miss:#a32d2d;--miss-soft:#fceaea;
  --mix:#854f0b;--mix-soft:#faeeda;
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC','STZhongsong','STSong',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --sidebar-w:260px;--radius:12px;
}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--text);background:var(--bg);
  line-height:1.8;min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--link);text-decoration:none}
img{max-width:100%}

/* ===== 侧栏 ===== */
.sidebar{width:var(--sidebar-w);background:var(--navy);position:fixed;top:0;left:0;bottom:0;
  overflow:hidden;z-index:100;display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.sidebar-header{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.logo{color:#fff;font-size:17px;font-weight:700;text-decoration:none;letter-spacing:.5px;
  font-family:var(--serif);display:inline-flex;align-items:center;gap:10px}
.logo-icon{width:28px;height:28px;flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.logo small{display:block;font-size:10px;font-weight:400;color:rgba(255,255,255,.42);
  letter-spacing:1.4px;margin-top:2px;font-family:var(--sans)}
.sidebar-nav{flex:1;min-height:0;padding:8px 0 22px;overflow-y:auto}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.nav-link{display:block;padding:6px 16px;color:#cbd5e1;text-decoration:none;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent;transition:all .15s}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff;text-decoration:none}
.nav-link.active{color:#fff;background:rgba(184,134,11,.15);border-left-color:var(--gold);font-weight:600}
.nav-home{font-size:14px;padding:10px 16px;font-weight:500;margin-bottom:4px}
.nav-talk{font-size:13.5px;font-weight:600;color:#F0D9A0;margin-bottom:6px}
.nav-talk:hover{color:#fff}
.nav-group{margin-bottom:2px}
.nav-group-title{padding:8px 16px;color:#cbd5e1;font-size:12px;font-weight:600;
  letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;transition:color .15s}
.nav-group-title:hover{color:#fff}
.caret{display:inline-block;width:0;height:0;border-left:5px solid #cbd5e1;border-top:4px solid transparent;
  border-bottom:4px solid transparent;transition:transform .2s;flex-shrink:0}
.nav-group-title.open .caret{transform:rotate(90deg);border-left-color:#fff}
.badge{margin-left:auto;background:rgba(255,255,255,.1);color:#cbd5e1;font-size:11px;
  padding:1px 6px;border-radius:8px;font-weight:400;flex-shrink:0}
.nav-group-items{display:none;padding-left:8px}
.nav-group-items.open{display:block}
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--navy);
  color:#fff;border:none;font-size:20px;padding:6px 11px;border-radius:6px;cursor:pointer;line-height:1}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,26,38,.45);z-index:99}
.scrim.on{display:block}

/* ===== 侧栏搜索 ===== */
.search-box{padding:8px 12px;position:relative}
.search-box input{width:100%;padding:7px 10px;border:1px solid rgba(255,255,255,.15);border-radius:6px;
  background:rgba(255,255,255,.08);color:#fff;font-size:13px;outline:none;font-family:var(--sans)}
.search-box input::placeholder{color:rgba(255,255,255,.4)}
.search-box input:focus{border-color:var(--gold);background:rgba(255,255,255,.12)}
#qres{display:none;position:absolute;left:12px;right:12px;top:100%;z-index:300;
  background:#1e293b;border:1px solid rgba(255,255,255,.12);border-radius:8px;
  max-height:70vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#qres.on{display:block}
.sr-item{display:block;padding:9px 12px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.06);transition:background .1s}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:rgba(184,134,11,.16)}
.sr-title{color:#fff;font-size:13px;font-weight:600;margin-right:6px}
.sr-type{font-size:10.5px;padding:1px 6px;border-radius:4px;color:rgba(255,255,255,.75);background:rgba(255,255,255,.1)}
.sr-snippet{display:block;font-size:12px;color:rgba(255,255,255,.52);margin-top:3px;line-height:1.55;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sr-snippet mark{background:rgba(212,168,67,.55);color:#fff;font-weight:600;border-radius:2px;padding:0 2px}
.sr-empty{padding:16px;text-align:center;color:rgba(255,255,255,.4);font-size:13px}
.sr-all{display:block;padding:9px 12px;margin-top:4px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;color:#d4a843!important;text-decoration:none}
.sr-all:hover{background:rgba(255,255,255,.06)}

/* ===== 主区 ===== */
.main{margin-left:max(var(--sidebar-w),calc((100vw - 1160px)/2));max-width:1160px;
  min-height:100vh;position:relative;display:flex;flex-direction:column}
.main::after{content:'';position:fixed;top:0;left:var(--sidebar-w);right:0;bottom:0;
  pointer-events:none;opacity:.022;z-index:999;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
#app{flex:1;min-width:0}
#app.app-home{padding:0 0 24px}
#app.app-page{max-width:980px;margin:0 auto;padding:40px 40px 56px;width:100%}
#app.app-read{max-width:1160px;padding:40px 48px 56px}
#boot{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.boot-inner{text-align:center;font-size:14px;color:var(--ink2);line-height:1.7}
.boot-inner small{display:block;margin-top:10px;font-size:12px;color:var(--ink3)}
.boot-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);
  margin-right:9px;vertical-align:1px;animation:bpop 1.1s infinite ease-in-out}
@keyframes bpop{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}
.sitefoot{border-top:1px solid var(--border);padding:20px 48px 30px;font-size:12px;
  color:var(--ink3);line-height:1.95;background:transparent}
.sitefoot b{color:var(--ink2);font-weight:600}
.sitefoot a{color:var(--gold)}
.sitefoot a:hover{text-decoration:underline}

/* ===== 首页 HERO ===== */
.hero-section{position:relative;padding:44px 48px 26px;max-width:900px;margin:0 auto}
.hero-row{display:flex;align-items:center;gap:28px}
.hero-text{min-width:0}
.hero-logo{display:block;width:clamp(76px,9vw,104px);height:auto;flex-shrink:0;
  opacity:0;animation:fadeUp .6s ease forwards;filter:drop-shadow(0 2px 8px rgba(184,134,11,.15))}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;
  opacity:0;animation:fadeUp .6s ease forwards}
.hero-eyebrow::before{content:'';width:24px;height:1px;background:var(--gold)}
.hero-title{font-family:var(--serif);font-size:clamp(28px,4.4vw,42px);font-weight:900;
  line-height:1.25;letter-spacing:-.3px;color:var(--navy);margin-bottom:4px;
  opacity:0;animation:fadeUp .6s ease .1s forwards}
.hero-title .gold{color:var(--gold);margin-left:.14em}
.hero-title h1{display:inline;font:inherit;letter-spacing:inherit;color:inherit;margin:0;padding:0}
.hero-version{display:inline-block;font-size:12px;padding:3px 10px;background:var(--gold);color:#fff;margin-left:12px;vertical-align:middle;
  border-radius:6px;font-weight:700;font-family:var(--sans);vertical-align:middle;position:relative;top:-4px;
  margin-left:8px;text-decoration:none;transition:all .2s;letter-spacing:1px}
.hero-version:hover{background:#9A7209;transform:translateY(-1px)}
.hero-by{font-size:14px;font-family:var(--sans);font-weight:500;color:var(--text2);
  vertical-align:middle;position:relative;top:-2px;margin-left:6px}
.hero-sub{font-size:16px;color:var(--ink2);line-height:1.75;margin-top:10px;max-width:660px;
  font-family:var(--serif);font-weight:400;opacity:0;animation:fadeUp .6s ease .2s forwards}
.hero-sub b{color:var(--navy);font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== 首页 数字条 ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;max-width:900px;margin:0 auto 30px;
  padding:0 48px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  opacity:0;animation:fadeUp .6s ease .3s forwards}
.stat-item{text-align:center;padding:18px 12px;position:relative;transition:background .3s;text-decoration:none;color:inherit}
.stat-item:not(:last-child)::after{content:'';position:absolute;right:0;top:20%;height:60%;width:1px;background:var(--border)}
.stat-item:hover{background:var(--gold-glow)}
.stat-num{font-family:var(--serif);font-size:36px;font-weight:900;color:var(--navy);line-height:1;margin-bottom:4px;letter-spacing:-1px}
.stat-label{font-size:12px;color:var(--ink2);font-weight:500;letter-spacing:.5px}
.main-inner{max-width:900px;padding:0 48px 20px;margin:0 auto}

/* ===== 首页 导航卡 ===== */
.nav-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px;
  opacity:0;animation:fadeUp .6s ease .4s forwards}
.nav-cards.nav-cards-5{grid-template-columns:repeat(5,1fr)}
.nav-card{position:relative;padding:20px 16px 18px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;text-decoration:none;transition:all .3s cubic-bezier(.4,0,.2,1);overflow:hidden;color:var(--text)}
.nav-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gold);opacity:0;transition:opacity .3s}
.nav-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.08);border-color:var(--gold-light);text-decoration:none}
.nav-card:hover::before{opacity:1}
.nav-card-icon{font-size:26px;margin-bottom:10px;display:block;line-height:1}
.nav-card-title{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--navy);margin-bottom:3px}
.nav-card-sub{font-size:12px;color:var(--ink2);line-height:1.55}
.nav-card-arrow{position:absolute;bottom:16px;right:16px;font-size:16px;color:var(--border);transition:all .3s}
.nav-card:hover .nav-card-arrow{color:var(--gold);transform:translateX(4px)}

/* ===== 首页 书封卡（年表入口） ===== */

/* ===== 首页 深色四步区 ===== */

/* ===== 首页 区块 ===== */
.section{margin-bottom:34px}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.section-line{flex:1;height:1px;background:var(--border)}
.section-title{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);white-space:nowrap;letter-spacing:-.3px}
.section-count{font-size:12px;color:var(--gold);font-weight:600;background:var(--gold-glow);
  padding:3px 10px;border-radius:12px;white-space:nowrap}
.tag-cloud{display:flex;flex-wrap:wrap;gap:10px}
.ctag{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:var(--card);
  border:1px solid var(--border);border-radius:24px;font-size:14px;color:var(--text);
  text-decoration:none;transition:all .25s cubic-bezier(.4,0,.2,1);font-weight:500}
.ctag:hover{border-color:var(--gold);color:var(--navy);box-shadow:0 4px 16px var(--gold-glow);
  transform:translateY(-2px);text-decoration:none}
.ctag-n{font-size:11px;font-weight:700;color:#fff;background:var(--gold);padding:2px 8px;
  border-radius:10px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.ctag.tier-1{font-size:16px;padding:10px 22px;font-weight:700;border-color:var(--gold-light);
  background:linear-gradient(135deg,#FFFDF5,#FFF8E7)}
.ctag.tier-1 .ctag-n{font-size:12px;padding:3px 10px}
.ctag.tier-2{font-size:15px;padding:9px 20px;font-weight:600}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.person-card{display:flex;flex-direction:column;align-items:center;padding:22px 14px 18px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;text-decoration:none;
  transition:all .3s;text-align:center;color:var(--text)}
.person-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.06);
  border-color:var(--gold-light);text-decoration:none}
.person-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-light));
  display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:11px;
  color:var(--gold-light);font-family:var(--serif);font-weight:700;box-shadow:0 4px 12px rgba(26,35,50,.15)}
.person-name{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--navy);margin-bottom:3px}
.person-refs{font-size:12px;color:var(--ink2)}
.changelog-hint{text-align:center;font-size:13px;color:var(--ink2);margin-top:28px;padding:15px;
  border:1px dashed var(--border);border-radius:10px;background:var(--cream);line-height:1.8}
.changelog-hint a{color:var(--gold);text-decoration:none;font-weight:600}
.changelog-hint a:hover{text-decoration:underline}
.audit-line{display:inline-block;margin-top:4px;font-size:12px;color:var(--ink3)}
.support-section{max-width:900px;margin:14px auto 0;padding:12px 22px;background:transparent;
  border:1px dashed var(--border);border-radius:10px}
.support-global{display:flex;align-items:center;gap:16px}
.support-text{display:flex;align-items:baseline;gap:9px;flex:1;min-width:0;flex-wrap:wrap}
.support-title{font-family:var(--serif);font-size:13.5px;font-weight:700;color:var(--navy);white-space:nowrap}
.support-desc{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.kofi-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:transparent;
  color:var(--ink2);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;
  text-decoration:none;transition:all .25s;white-space:nowrap;flex-shrink:0}
.kofi-btn:hover{background:var(--cream);color:var(--gold);border-color:var(--gold);text-decoration:none}

/* ===== 通用文字与卡片 ===== */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.h1{font-family:var(--serif);font-size:30px;font-weight:900;margin:0 0 8px;color:var(--navy);letter-spacing:-.2px;line-height:1.35}
.h2{font-family:var(--serif);font-size:20px;font-weight:700;margin:34px 0 13px;padding-bottom:8px;
  border-bottom:2px solid var(--border);color:var(--navy)}
.lead{color:var(--ink2);font-size:14px;margin:0 0 22px;line-height:1.85;max-width:860px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line2);
  color:var(--ink2);background:#fff;white-space:nowrap;vertical-align:1px}
.tag.hit{background:var(--hit-soft);border-color:#c0dd97;color:var(--hit)}
.tag.miss{background:var(--miss-soft);border-color:#f0b8b8;color:var(--miss)}
.tag.mix{background:var(--mix-soft);border-color:#efc477;color:var(--mix)}
.tag.p{background:var(--cream);border-color:#E8D7B4;color:var(--gold)}
.tag.b{background:var(--accent-soft);border-color:#e3cd9a;color:var(--accent)}
.tag.s{background:#f3eef8;border-color:#cec2e4;color:#5b3f9e}
.tag.autotag{background:#eef1f4;border-color:#cdd6de;color:#5f6b76}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:13px;margin-bottom:6px}
.feat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;cursor:pointer;transition:.16s;display:block;color:var(--text);text-decoration:none}
.feat:hover{border-color:var(--gold-light);text-decoration:none;transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.05)}
.feat h4{margin:0 0 6px;font-family:var(--serif);font-size:15px;font-weight:700;color:var(--navy)}
.feat p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.75}
.feat .k{font-size:11px;color:var(--gold);margin-top:9px;display:block}
.empty{color:var(--ink3);font-size:13.5px;padding:30px 0;text-align:center}
.btn{font-size:12.5px;padding:4px 12px;border:1px solid var(--line2);border-radius:6px;background:#fff;
  color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s;display:inline-block}
.btn:hover{border-color:var(--gold);color:var(--gold);text-decoration:none}
.btn.on{background:var(--accent-soft);border-color:var(--gold);color:var(--gold);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 6px}
.chip{font-size:12.5px;padding:3px 11px;border:1px solid var(--line2);border-radius:20px;background:#fff;
  cursor:pointer;color:var(--ink2);text-decoration:none;display:inline-block}
.chip:hover{border-color:var(--gold);color:var(--navy);text-decoration:none}
.chip i{font-style:normal;color:var(--ink3);font-size:11px}
.chip:hover i{color:var(--gold)}
.more{font-size:12px;color:var(--link);cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
/* 纯展示的 chip（图例等）不是链接，不能给手型，否则用户会以为点得动 */
span.chip,span.chip:hover,.chip-k{cursor:default}
.chip-k:hover{border-color:var(--line2);color:var(--ink2)}
a.chip{cursor:pointer}

/* ===== 阅读页 ===== */
.rwrap{display:grid;grid-template-columns:minmax(0,1fr) 246px;gap:30px;align-items:start;min-width:0}
#body{min-width:0}
.side{position:sticky;top:24px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:15px 16px;font-size:13px;max-height:calc(100vh - 48px);overflow:auto;min-width:0}
.side h5{margin:0 0 9px;font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.side .e{display:flex;justify-content:space-between;gap:8px;padding:3.5px 0;color:var(--ink2);text-decoration:none;font-size:12.5px}
.side .e:hover{color:var(--gold);text-decoration:none}
.side .e i{font-style:normal;color:var(--ink3);font-size:11px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding-bottom:13px;border-bottom:1px solid var(--border)}
.ltitle{font-family:var(--serif);font-size:29px;font-weight:900;margin:0 0 4px;color:var(--navy);letter-spacing:-.2px}
.lmeta{font-size:12px;color:var(--ink3);margin-bottom:18px;letter-spacing:.2px}
.blk{margin:0 0 15px}
.blk.h{font-family:var(--serif);font-size:19px;font-weight:700;margin:30px 0 12px;color:var(--navy)}
.blk.p{text-align:justify;font-size:16px;line-height:2;color:#232019}
.blk.cur{background:var(--accent-soft);border-radius:6px;padding:6px 9px;margin-left:-9px;margin-right:-9px}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0 16px;font-variant-numeric:tabular-nums;background:#fff}
th,td{border:1px solid var(--border);padding:5px 9px;text-align:right}
th{background:var(--bg2);text-align:center;font-weight:600;color:var(--navy)}
td:first-child,th:first-child{text-align:left}
.ent{border-bottom:1px dashed rgba(139,94,11,.55);cursor:pointer;color:inherit}
.ent:hover{background:var(--accent-soft);color:var(--link)}

/* ===== 实体页 / 概念页 ===== */
.epath{font-size:12.5px;color:var(--ink3);margin-bottom:14px;letter-spacing:.2px}
.lrow{display:flex;align-items:baseline;gap:12px;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;margin-bottom:7px;transition:.14s;color:var(--text);text-decoration:none}
.lrow:hover{border-color:var(--gold-light);transform:translateX(2px);text-decoration:none}
.lrow .ly{font-family:var(--serif);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;min-width:42px}
.lrow .lt{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lm{font-size:12px;color:var(--ink3);white-space:nowrap}
.agrtag{font-style:normal;font-size:10.5px;color:var(--gold);border:1px solid #E8D7B4;background:var(--cream);
  border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:1px}
.epath a{color:var(--ink2)}
.epath a:hover{color:var(--gold)}
.ename{font-family:var(--serif);font-size:30px;font-weight:900;margin:0;color:var(--navy);letter-spacing:-.2px}
.een{color:var(--ink3);font-size:13px;margin:3px 0 14px}
.een a{color:var(--gold)}
.een a:hover{text-decoration:underline}
.esum{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--gold);
  border-radius:8px;padding:14px 17px;font-size:14px;color:var(--ink2);line-height:1.9;margin-bottom:18px}
.yrblk{margin-bottom:18px}
.yrhd{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.yrhd b{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--gold)}
.yrhd span{font-size:11.5px;color:var(--ink3)}
.snip{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;
  margin-bottom:6px;font-size:14px;line-height:1.85;color:var(--text);cursor:pointer;transition:.14s}
.snip:hover{border-color:var(--gold-light);background:#FFFDF8}
.snip mark{background:#FBEFC6;color:inherit;padding:0 2px;border-radius:2px}
.snip .go{float:right;font-size:11px;color:var(--ink3);font-family:var(--sans)}
.snip:hover .go{color:var(--gold)}
a.snip.qsnip{display:block;text-decoration:none;color:var(--text);padding:11px 15px}
a.snip.qsnip:hover{text-decoration:none;color:var(--text)}
/* 出处单独占一行，不要 float：长摘录里浮动的年份标签会压到正文上 */
.qsnip .go{float:none;display:block;text-align:left;margin-bottom:3px;font-size:11px;color:var(--ink3)}
.qsnip .go b{color:var(--gold);font-weight:600}

/* ===== 记分牌 ===== */
.sc{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:17px 19px;margin-bottom:14px}
.sc h3{margin:0 0 3px;font-family:var(--serif);font-size:18px;font-weight:700;color:var(--navy)}
.scmeta{font-size:12px;color:var(--ink3);margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scmeta a{color:var(--gold)}
.claim{background:var(--accent-soft);border-radius:8px;padding:12px 15px;margin-bottom:12px;
  font-size:14px;line-height:1.85;border:1px solid #F2E6CC}
.claim .lb{font-size:11px;color:var(--gold);font-weight:700;display:block;margin-bottom:3px;
  font-family:var(--sans);letter-spacing:.6px}
.claim .cf{font-size:12px;color:var(--ink2);margin-top:8px;padding-top:8px;border-top:1px dashed #E8D7B4;font-family:var(--sans)}
.tl{border-left:2px solid var(--border);margin:0 0 13px;padding-left:0;list-style:none}
.tl li{position:relative;padding:0 0 12px 20px;font-size:13.5px;line-height:1.75;color:var(--ink2)}
.tl li:before{content:"";position:absolute;left:-5px;top:8px;width:8px;height:8px;border-radius:50%;
  background:var(--line2);border:2px solid var(--panel)}
.tl li.claim:before{background:var(--gold)}
.tl li.act:before{background:#185fa5}
.tl li.fact:before{background:var(--hit)}
.tl li b{color:var(--ink);font-weight:600;margin-right:7px;font-variant-numeric:tabular-nums}
.tl li.fact{color:var(--ink)}
.out{background:var(--bg2);border-radius:8px;padding:12px 15px;font-size:13.5px;line-height:1.85}
.out .lb{font-size:11px;color:var(--ink3);font-weight:700;display:block;margin-bottom:3px;letter-spacing:.6px}
.src{font-size:11.5px;color:var(--ink3);margin-top:10px}
.src-link{font-size:11.5px;color:var(--ink3);margin-left:8px;white-space:nowrap;font-weight:400}
.src-link:hover{text-decoration:underline;color:var(--gold)}

/* ===== 公司页 ===== */
.cogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.co{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
  cursor:pointer;transition:.16s;display:block;color:var(--text);text-decoration:none}
.co:hover{border-color:var(--gold-light);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.05);text-decoration:none}
.co h4{margin:0 0 4px;font-family:var(--serif);font-size:15.5px;font-weight:700;color:var(--navy)}
.co .cmeta{font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.co .cpeek{font-size:12px;color:var(--ink2);line-height:1.7}
.co .cpeek div{padding:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co .cpeek b{color:var(--gold);font-weight:600;margin-right:5px;font-variant-numeric:tabular-nums}
.axis{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0 20px;padding:12px 0;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.ax{width:17px;height:26px;border-radius:3px;background:#F4EFE7;position:relative;cursor:default;font-size:0}
/* 只有真的有记录的年份才是可点的，其余刻度是背景刻度线 */
.ax.on{background:var(--gold);opacity:.85;cursor:pointer}
.ax.on:hover{outline:2px solid var(--gold-light);outline-offset:1px}
.ax.off:hover{outline:none}
.trow{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid #F1EADF;
  font-size:13.5px;line-height:1.85}
.trow .ty{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;font-family:var(--serif)}
.trow .tn{color:var(--ink2)}
.trow .tn b{color:var(--ink);font-weight:600}
.trow.tblrow .tn{color:var(--ink2);font-size:12.5px}
.trow.tblrow .ty{color:var(--ink3)}
[data-jump]{cursor:pointer;transition:background .12s}
[data-jump]:hover{background:#FFFCF5}
.ci[data-jump]:hover{background:#FFFCF5;border-left-color:var(--gold)}
.trow[data-jump]:hover{background:#FFFCF5}
.quote[data-jump]:hover{background:#FFFCF5}
.period[data-jump]:hover{background:#FFFCF5;border-color:var(--gold-light)}
.rule[data-jump]:hover{background:#FFFCF5;border-color:var(--gold-light)}
span.chip{cursor:default}
.enttag{color:var(--ink3)}

/* ===== 术语演化 ===== */
.pline{display:flex;gap:0;margin:0 0 22px;overflow-x:auto;padding-bottom:8px}
.pd{flex:1 1 0;min-width:126px;position:relative;padding:0 9px 0 0}
.pd .bar{height:5px;background:#EFE8DD;border-radius:3px;position:relative;overflow:hidden}
.pd .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:3px}
.pd .pn{font-family:var(--serif);font-size:13.5px;font-weight:700;margin:9px 0 2px;color:var(--navy)}
.pd .py{font-size:11px;color:var(--gold);margin-bottom:5px;font-variant-numeric:tabular-nums;display:inline-block}
/* 收录范围外的年份（如 1949、1954）：保持同样样式但不可点，避免点了进死路 */
.noyr{cursor:default;opacity:.7}
a.noyr{text-decoration:none;pointer-events:none}
.pd .py:hover{text-decoration:underline}
.pd .pt{font-size:12.5px;color:var(--ink2);line-height:1.75}
.period{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.period .ph{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.period .ph b{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--navy)}
.period .ph span{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.period .ph a{font-size:12px;color:var(--gold)}
.period .pb{font-size:14px;line-height:1.95;color:var(--ink2);text-align:justify}
.quote{border-left:3px solid var(--gold-light);padding:4px 0 4px 16px;margin:0 0 16px;position:relative;border-radius:0 6px 6px 0}
.quote .qt{font-size:15px;line-height:1.95;font-family:var(--serif);color:#2A2620}
.quote .qy{font-size:11.5px;color:var(--ink3);margin-top:5px}
.pit{background:#FFFCF5;border:1px solid #F0E2C8;border-radius:8px;padding:12px 16px;
  font-size:13px;line-height:1.85;color:var(--ink2);margin-bottom:8px}

/* ===== 认错档案 ===== */
.ct{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 19px;margin-bottom:13px}
.ct h3{margin:0 0 11px;font-family:var(--serif);font-size:17px;font-weight:700;color:var(--navy)}
.ci{padding:9px 0 9px 14px;border-left:2px solid var(--border);margin-bottom:7px;font-size:13.5px;
  line-height:1.85;color:var(--ink2);border-radius:0 4px 4px 0}
.ci.admit{border-left-color:#185fa5}
.ci.error{border-left-color:var(--miss)}
.ci.lesson{border-left-color:var(--gold)}
.ci.reverse{border-left-color:#5b3f9e}
.ci b{color:var(--ink);font-weight:700;margin-right:7px;font-variant-numeric:tabular-nums}

/* ===== 规则库 / 搜索框 ===== */
.sbox{display:flex;gap:9px;margin:0 0 18px;flex-wrap:wrap;align-items:center}
.sbox input{flex:1 1 240px;font-size:14px;padding:8px 14px;border:1px solid var(--line2);
  border-radius:8px;background:#fff;color:var(--ink);font-family:inherit}
.sbox input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
.rule{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:14px 17px;margin-bottom:10px;transition:.14s}
.rule .rt{font-size:14.5px;line-height:1.95;color:#2A2620}
.rule .rm{font-size:11.5px;color:var(--ink3);margin-top:6px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.rule mark{background:#FBEFC6;color:inherit;padding:0 2px;border-radius:2px}

/* ===== 决策卡 ===== */
.dc{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.dc h3{margin:0 0 4px;font-family:var(--serif);font-size:18px;font-weight:700;color:var(--navy)}
.scene{background:var(--bg2);border-radius:8px;padding:13px 16px;font-size:14px;line-height:1.9;
  margin-bottom:13px;color:var(--ink2)}
.facts{list-style:none;padding:0;margin:0 0 14px}
.facts li{padding:5px 0 5px 18px;position:relative;font-size:13.5px;color:var(--ink2);line-height:1.75}
.facts li:before{content:"";position:absolute;left:3px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--line2)}
.opts{display:grid;gap:7px;margin-bottom:6px}
.opt{text-align:left;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:11px 15px;
  cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);line-height:1.65;transition:.14s}
.opt:hover{border-color:var(--gold);background:var(--accent-soft)}
.opt.pick{border-color:var(--gold);background:var(--accent-soft);font-weight:600}
/* 已揭晓的选项是禁用态，不能再给手型和 hover，否则像还能再点一次 */
.opt[disabled]{cursor:default;opacity:.72}
.opt[disabled]:hover{border-color:var(--line2);background:#fff}
.opt.pick[disabled]{opacity:1}
.opt.pick[disabled]:hover{border-color:var(--gold);background:var(--accent-soft)}
.opt .n{font-weight:700;margin-right:6px;color:var(--gold)}
.reveal{margin-top:14px;border-top:1px dashed var(--line2);padding-top:14px}
.reveal .row{margin-bottom:9px;font-size:13.5px;line-height:1.85}
.reveal .lb{font-size:11px;font-weight:700;color:var(--ink3);display:block;margin-bottom:3px;letter-spacing:.6px}
.reveal .actual{background:var(--accent-soft);border-radius:8px;padding:11px 14px;border:1px solid #F2E6CC}
.reveal .result{background:var(--bg2);border-radius:8px;padding:11px 14px}
.you{font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.you b{color:var(--gold)}

/* ===== 入门导引 ===== */
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:6px}
.pcard{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--gold);
  border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:.16s}
.pcard:hover{border-color:var(--gold-light);border-left-color:var(--gold);transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,.05)}
.pcard h4{margin:0 0 5px;font-family:var(--serif);font-size:15.5px;font-weight:700;color:var(--navy)}
.pcard p{margin:0 0 10px;font-size:12.5px;color:var(--ink2);line-height:1.75}
.pcard .pys{display:flex;gap:5px;flex-wrap:wrap}
.pcard .py2{font-size:11.5px;padding:2px 9px;border:1px solid var(--border);border-radius:5px;
  color:var(--gold);font-variant-numeric:tabular-nums;background:var(--cream)}

/* ===== 年表网格 ===== */
.yrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:7px}
.yr{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:9px 4px;
  text-align:center;cursor:pointer;font-size:13px;transition:.14s}
.yr:hover{border-color:var(--gold);background:var(--accent-soft);transform:translateY(-1px)}
.yr b{display:block;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--navy)}
.yr span{font-size:10px;color:var(--ink3)}
.yr .dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin:3px 1px 0}
.dot.p{background:#5b3f9e}.dot.b{background:var(--gold)}.dot.s{background:#1f7a6a}

/* ===== 巴菲特午餐会：首页入口 ===== */
.talk-banner{background:linear-gradient(135deg,#1B2231,#141821);border-radius:18px;
  padding:26px 30px;margin:34px 0 8px;display:flex;align-items:center;justify-content:space-between;
  gap:26px;color:#F2EADA;box-shadow:0 12px 28px rgba(20,24,32,.16);position:relative;overflow:hidden}
.talk-banner::after{content:'';position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,168,67,.16),transparent 70%);pointer-events:none}
.tb-left{max-width:560px;position:relative;z-index:1}
.tb-tag{display:inline-block;background:var(--gold-light);color:#20180A;font-size:11px;font-weight:700;
  letter-spacing:1px;padding:2px 9px;border-radius:5px}
.tb-title{font-family:var(--serif);font-size:25px;font-weight:700;color:#F6EFDF;margin:9px 0 6px;
  display:flex;align-items:center;gap:10px;line-height:1.4}
.tb-ico{display:inline-flex;color:var(--gold-light)}
.tb-beta{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:1px;color:#C9C2B2;
  border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:1px 6px}
.tb-desc{font-size:13.5px;line-height:1.85;color:#B9B3A6;margin-bottom:16px}
.tb-btn{display:inline-block;background:var(--gold);color:#fff;font-size:14px;font-weight:600;
  padding:10px 22px;border-radius:8px;transition:background .15s,transform .15s}
.tb-btn:hover{background:var(--gold-light);color:#20180A;transform:translateY(-1px)}
.tb-qs{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;flex-shrink:0}
.tb-q{border:1px solid rgba(255,255,255,.22);background:transparent;color:#D8D2C4;font-size:13px;
  font-family:var(--sans);padding:8px 16px;border-radius:999px;cursor:pointer;text-align:left;
  transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.tb-q:hover{border-color:var(--gold-light);color:#F6EFDF;background:rgba(212,168,67,.08)}

/* ===== 巴菲特午餐会：对话页 ===== */
.talk-page{max-width:860px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100vh - 200px)}
#talk-body{flex:1 0 auto}
.tp-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--border);padding-bottom:14px}
.tp-brand{font-family:var(--serif);font-size:23px;font-weight:700;color:var(--navy);
  display:flex;align-items:center;gap:9px;line-height:1.4}
.tp-brand svg{color:var(--gold)}
.tp-back{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.tp-back:hover{color:var(--gold)}
.tp-sub{font-size:12.5px;color:var(--ink3);margin:9px 0 24px}
.tp-hero{text-align:center;padding:30px 0 14px}
.tp-cup{font-size:44px;line-height:1;filter:grayscale(.1)}
.tp-cup svg{color:var(--gold);opacity:.9}
.tp-hero p{color:var(--ink3);font-size:13px;margin:14px 0 18px}
.tp-topics{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto;text-align:left}
.tp-topic{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
  cursor:pointer;font-family:var(--sans);text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s}
.tp-topic:hover{border-color:var(--gold-light);box-shadow:0 4px 14px rgba(184,134,11,.10);transform:translateY(-1px)}
.tp-topic b{display:block;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.6px;margin-bottom:3px}
.tp-topic span{font-size:14px;color:var(--text)}
/* scroll-margin-bottom 要盖住粘在底部那一整条（输入框 + 开关），
   否则"滚到最后一条"会被它压住一截。 */
.msg{display:flex;gap:10px;margin:0 0 20px;align-items:flex-start;scroll-margin-bottom:150px}
.msg.u{justify-content:flex-end}
.msg .bubble{max-width:80%;padding:12px 16px;border-radius:14px;font-size:14.5px;line-height:1.85}
.msg.u .bubble{background:var(--gold);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.b .bubble{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .ava{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.msg .ava svg{color:var(--gold)}
.msg.b .bubble p{margin:0 0 9px}
.msg.b .bubble p:last-child{margin-bottom:0}
.tq{border-left:3px solid var(--gold-light);background:var(--cream);padding:9px 13px;border-radius:0 8px 8px 0;
  font-size:13.5px;line-height:1.85;color:#3A342B;margin:9px 0}
.tq .src{display:block;margin-top:5px;font-size:11.5px;color:var(--ink3)}
.tq .src a{color:var(--gold);font-weight:600}
.ttyping{color:var(--ink3);font-size:13px}
.talk-sum{background:var(--bg2);border-radius:8px;padding:10px 13px;font-size:12.8px;line-height:1.8;
  color:var(--ink2);margin:9px 0}
.talk-follow{color:var(--ink3);font-size:13px}
.tp-bar{position:sticky;bottom:0;background:var(--bg);z-index:5;padding-top:22px;margin-top:26px}
.tp-composer{display:flex;gap:9px;align-items:center;padding:14px 0 10px;
  border-top:1px solid var(--border)}
.tp-composer input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;
  font-size:14.5px;font-family:var(--sans);background:var(--panel);color:var(--text);outline:none}
.tp-composer input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}

var CY1 = Math.max.apply(null, C.letters.map(function(l){ return l.year; }));
var SURFACES = [], EXCLUDE = {};
/* 全文字数按切块实算（含表格），页脚校验条直接引用，避免文案与数据对不上 */
var TOTCHARS = 0;
Object.keys(L).forEach(function(id){
  L[id].blocks.forEach(function(b){ TOTCHARS += blockText(b).length; });
});
/* 页脚和首页校验条引用的数字一律运行时算，避免写死后和数据对不上 */
/* 审计结论：三个数字来自 linkaudit.js / actaudit.js 对 2026-10-30 这一版内容的
   实测输出，浏览器里算不出来，只能写常量。改内容后要重跑两个脚本再改这里。
   AUD_CLICK 是三次真实鼠标点击的合计：抽样链接 959 + 侧栏 243 + 无 href 元素 74。
   （早先是 962：那三条 #/talk?q= 会落地自动提问，在线时一问几十秒，已改由 talktest 专测。）

var AUD_ROUTE = 446, AUD_HIT = 4743, AUD_CLICK = 1276;
var NROUTE = 0;
(function(){
  var cnt = {};
  for (var k in C.mentions) cnt[k] = C.mentions[k].length + (C.overflow[k]||0);

var IS_CONCEPT = {}, IS_COMPANY = {}, IS_PERSON = {};
C.concepts.forEach(function(e){ IS_CONCEPT[e.name] = 1; });
C.companies.forEach(function(e){ IS_COMPANY[e.name] = 1; });
C.people.forEach(function(e){ IS_PERSON[e.name] = 1; });

  '伯克希尔·哈撒韦（保险业务）': '伯克希尔哈撒韦',
  '伯克希尔哈撒韦再保险集团': '伯克希尔哈撒韦',
  '伯克希尔纺织厂': '伯克希尔哈撒韦',
  '苹果公司': '苹果',
  '国民保险': '国民保险公司',
  '内布拉斯加家具城': '内布拉斯加家具店',
  '大都会公司': '大都会通信'
};
/* 没有独立实体页、但正文里确实出现过的名字：用更短、更容易命中的词去检索 */
var SEARCHAS = {
  '长期资本管理公司（LTCM）': '长期资本管理公司',
  '长期资本管理公司': '长期资本管理公司',
  'Waumbec纺织厂': 'Waumbec',
  '安然公司': '安然',
  '登普斯特农具机械': '登普斯特'
};
function searchHref(term){ return '#/q/' + encodeURIComponent(term); }
/* 有独立页面的(概念页/公司页)，否则回落到原文出场页，最后兜底到全文检索。
   任何名字都返回一个能跳的地址，不留死链。 */
function entHref(name){
  if (!name) return null;
  var n = ALIAS[name] || name;
  if (CT.concepts[n]) return '#/c/' + encodeURIComponent(n);
  if (CT.companies[n]) return '#/co/' + encodeURIComponent(n);
  if (IS_CONCEPT[n]) return '#/e/concepts/' + encodeURIComponent(n);
  if (IS_COMPANY[n]) return '#/e/companies/' + encodeURIComponent(n);
  if (IS_PERSON[n]) return '#/e/people/' + encodeURIComponent(n);
  return searchHref(SEARCHAS[name] || name);
}
/* 有信件的年份数：年表里每一格都对应一个 #/y/<年> 地址，必须算进路由总数 */
var NYEAR = (function(){ var s = {}; C.letters.forEach(function(l){ s[l.year] = 1; }); return Object.keys(s).length; })();

   概念和公司各算两遍是有原因的：一个概念既有「跨年档案」#/c/X，又有「原文出场」#/e/concepts/X，
   公司同理（#/co/X 与 #/e/companies/X），两个地址都得算进总数，否则和页脚文案对不上。 */
NROUTE = C.letters.length + C.concepts.length + C.companies.length +
         C.concepts.length + C.companies.length + C.people.length + 9 + NYEAR;
function entLink(name, cls, label, tail){
  var h = entHref(name);
  var t = esc(label || name) + (tail || '');
  return h ? '<a class="' + cls + '" href="' + h + '">' + t + '</a>'
           : '<span class="' + cls + '">' + t + '</span>';
}
/* 地址栏里可能残留半个 % 转义（%E4 之类），decodeURIComponent 会抛错把整页打空 */
function dec(s){
  try { return decodeURIComponent(s); } catch (e) { return String(s); }
}
/* 剥掉 hash 里的 ?b=N 之类的定位参数，只留路由 */
function route(){
  return (location.hash.slice(1).split('?')[0]) || '/';
}
function hashNum(key){
  var m = location.hash.match(new RegExp('[?&]' + key + '=(\\d+)'));
  return m ? +m[1] : null;
}

/* 中英混排里的英文直引号很难看，显示时按成对关系换成中文引号。

function zhq(s){
  if (!/[\u4e00-\u9fff]/.test(s) || s.indexOf('"') === -1) return s;

  return s.replace(/"/g, function(){ var c = open ? '\u201c' : '\u201d'; open = !open; return c; });

  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function openYear(y){ go('#/y/' + y); }
/* 哪些年份真的有信。概念分期里会出现 1949、1954 这类"背景起点"年份，

var YHAS = {};
C.letters.forEach(function(l){ YHAS[l.year] = (YHAS[l.year] || 0) + 1; });

function yearLink(y, label, cls, title){

    (title ? ' title="' + title + '"' : '') + '>' + t + '</a>';

function yearPage(y){
  var ls = C.letters.filter(function(l){ return l.year === y; });
  var h = '<div class="epath"><a href="#/">年表</a> · ' + y + ' 年</div>' +
    '<h1 class="h1">' + y + ' 年</h1>';
  var prev = null, next = null;
  C.letters.forEach(function(l){ if (l.year < y) prev = Math.max(prev || 0, l.year); });

  if (!ls.length){
    // 收录范围外的年份不该是死路：说明为什么空着，并给出最近的年份和年表出口
    return h + '<p class="lead">' + y + ' 年不在收录范围内——本站收录 <b>' + CY0 + '–' + CY1 +

  h += '<p class="lead">' + (ls.length > 1 ? '这一年有 ' + ls.length + ' 封，点开任意一封。' : '点开读原文。') + '</p>';
  ls.forEach(function(l){

  var cs = (CT.corrections || []).filter(function(c){ return c.y === y; });
  if (cs.length){
    h += '<h2 class="h2">这一年他说过的自我修正</h2>';
    cs.forEach(function(c){
      h += '<div class="ci ' + c.k + '"' + jumpAttr(c.loc) + '><b>' + y + '</b><span class="tag">' + CORR_LB[c.k] + '</span> ' +
        (c.ent ? entLink(c.ent, '', '[' + c.ent + ']') + ' ' : '') + esc(c.t) + locLink(c.loc) + '</div>';

  return h;
}
function year0(s){ var m = String(s).match(/\d{4}/); return m ? +m[0] : 0; }
function blockText(b){
  if (b.k === 't') return (b.head||[]).concat(b.rows.map(function(r){return r.join(' ');})).join(' ');
  return b.t;
}
function markIn(text, name){
  var forms = (C.surf[name]||[name]).slice().sort(function(a,b){return b.length-a.length;});
  var out = esc(text);
  forms.forEach(function(f){
    out = out.split(esc(f)).join('' + esc(f) + '');
  });
  return out.replace(//g,'<mark>').replace(//g,'</mark>');
}

/* ---------- 行内实体高亮(逐段拼接避免互相覆盖) ---------- */
function renderPara(text){
  var hits = [], i, t;
  for (i = 0; i < SURFACES.length; i++){
    var f = SURFACES[i].f, p = 0;
    while ((p = text.indexOf(f, p)) !== -1){
      hits.push({s:p, e:p+f.length, n:SURFACES[i].name, k:SURFACES[i].kind});
      p += 1;
    }
  }
  if (!hits.length) return esc(text);
  hits.sort(function(a,b){ return (b.e-b.s)-(a.e-a.s) || a.s-b.s; });
  var taken = new Uint8Array(text.length), chosen = [], ok;
  for (i = 0; i < hits.length; i++){
    ok = true;
    for (t = hits[i].s; t < hits[i].e; t++) if (taken[t]) { ok = false; break; }
    if (ok){ for (t = hits[i].s; t < hits[i].e; t++) taken[t] = 1; chosen.push(hits[i]); }
  }
  chosen.sort(function(a,b){ return a.s-b.s; });
  var out = '', pos = 0;
  chosen.forEach(function(h){
    out += esc(text.slice(pos, h.s));
    out += '<span class="ent" data-e="' + esc(h.n) + '" data-k="' + h.k + '">' +
           esc(text.slice(h.s, h.e)) + '</span>';
    pos = h.e;
  });
  return out + esc(text.slice(pos));
}

      if (pp === -1) continue;
      paras.push({id: id, b: bi,
        s: (pp > 26 ? '…' : '') + tx.slice(Math.max(0, pp - 26), pp + 70) + '…'});
      got++;
    }
  }
  if (!paras.length){
    h += '<p class="lead">实体库和 ' + C.letters.length + ' 封信的正文里都没有「' + esc(q) + '」。' +
      '换个更短的词试试，比如只留公司名的前两个字。</p>' +
      '<div class="toolbar"><a class="btn" href="#/ents">去实体总览</a>' +
      '<a class="btn" href="#/letters">去信件总览</a><a class="btn" href="#/">回首页</a></div>';
    return h;
  }
  h += '<h2 class="h2">原文里出现 ' + (paras.length >= 80 ? '80+' : paras.length) + ' 段</h2>' +
    '<p class="lead" style="margin:-6px 0 14px">实体库命中 ' + hits.length +
    ' 个，下面每段都直接跳到那封信的对应位置。</p>';
  paras.forEach(function(p){
    h += '<a class="snip qsnip" href="#/l/' + encodeURIComponent(p.id) + '?b=' + p.b + '">' +
      '<span class="go"><b>' + esc(p.id.replace(' 巴菲特致股东信', '').replace(' 巴菲特致合伙人信', '')) +
      '</b> · 第 ' + (p.b + 1) + ' 段</span>' +
      markIn(p.s, q) + '</a>';
  });
  h += '<div class="toolbar"><a class="btn" href="#/ents">实体总览</a>' +
    '<a class="btn" href="#/letters">信件总览</a><a class="btn" href="#/">回首页</a></div>';
  return h;
}
/* ---------- 兜底页：任何不存在的路由都要说清楚，不能静默回首页 ---------- */
function notFound(kind, name){
  return '<div class="epath"><a href="#/">首页</a> · 没找到</div>' +
    '<h1 class="h1">没有这个' + esc(kind) + '</h1>' +
    '<p class="lead">地址里的「' + esc(name) + '」在站内没有对应内容。' +
    '可能是链接抄错了，也可能这个名字只有原文出场、没有单独成页。</p>' +
    '<div class="toolbar">' +
    (name && name.length > 1 ? '<a class="btn" href="' + searchHref(name) + '">在全文里搜「' + esc(name.slice(0, 10)) + '」</a>' : '') +
    '<a class="btn" href="#/ents">实体总览</a>' +
    '<a class="btn" href="#/letters">全部信件</a>' +
    '<a class="btn" href="#/">回首页</a></div>';
}

/* ---------- 实体总览 ---------- */
function ents(){
  var h = '<h1 class="h1">实体</h1><p class="lead">点任意一个，看它在 ' + (CY1 - CY0 + 1) + ' 年里的每一次出场。' +
    '标「补录」的是拿信件全文独立扫描后补进来的（源档案库未收录）。</p>';
  [['companies','公司', C.companies], ['concepts','概念', C.concepts], ['people','人物', C.people]].forEach(function(g){
    var list = g[2].slice().sort(function(a,b){ return entCount(b.name) - entCount(a.name); });
    h += '<h2 class="h2">' + g[1] + ' · ' + list.length + '</h2><div class="fgrid">';
    list.forEach(function(e){
      h += '<a class="feat" href="#/e/' + g[0] + '/' + encodeURIComponent(e.name) + '">' +
        '<h4>' + esc(e.name) + (e.auto ? ' <span class="tag autotag" style="font-size:10px;vertical-align:2px">补录</span>' : '') + '</h4>' +
        '<p>' + (e.summary ? esc(e.summary.slice(0, 58)) + '…' : esc(e.en || '')) + '</p>' +
        '<span class="k">' + entCount(e.name) + ' 段提及</span></a>';
    });
    h += '</div>';
  });
  return h;
}

/* ---------- 记分牌 ---------- */
function score(){
  var h = '<h1 class="h1">记分牌</h1><p class="lead">' +
    '他每年都在信里下判断。这里把三件事并排：当年怎么说的、当时说得多确定、后来事实是什么。<br>' +
    '命中和错判都列——只列对的那不叫记分牌，叫宣传册。全部条目取自语料并标注出处年份。</p>';
  // 精选判断: 逐条核对的 6 条 + 人工整理的 15 张, 全部同一卡片样式
  var allCards = C.scorecard.concat(
    Object.keys(CT.scorecards || {})
      .filter(function(k){ return !CT.scorecards[k].auto; })
      .map(function(k){ return CT.scorecards[k]; }));
  var hits = allCards.filter(function(s){ return s.verdict === 'hit'; }).length;
  var miss = allCards.filter(function(s){ return s.verdict === 'miss'; }).length;
  h += '<p style="margin:-10px 0 20px;font-size:13px;color:var(--ink3)">' +
    '精选判断 ' + allCards.length + ' 张：命中 ' + hits + ' · 错判 ' + miss + ' · 参半 ' +
    (allCards.length - hits - miss) + ' —— 点公司名进公司页，每家也有同款判断卡片（其余为自动整理）</p>';
  allCards.forEach(function(s){
    h += scCard(s, '') + '';
  });

  var allNames = Object.keys(CT.companies || {});
  var totTL = allNames.reduce(function(a,k){ return a + (CT.companies[k].timeline || []).length; }, 0);
  var totFill = allNames.reduce(function(a,k){ return a + (CT.companies[k].filled || 0); }, 0);
  var list = coList();

  h += '<h2 class="h2">公司轨迹 · 人工档案 ' + allNames.length + ' 家 · ' + totTL + ' 条时间线</h2>' +
    '<p class="lead" style="margin-bottom:14px">上面是精选判断卡片。下面是这 ' + allNames.length +
    ' 家有人工档案的公司的完整年份轨迹——每条都带原文落点（点「原文 ↗」跳到那一年的信）；' +
    '另有 ' + (C.companies.length - allNames.length) + ' 家是全文扫描补录的，列在页面底部。' +
    '要点取自实体档案，档案里没写的从当年信件正文回填（已回填 ' + totFill + ' 条），' +
    '只有持仓表的年份标「持仓表」。点任意公司进它的记分牌页面。</p>';

  h += '<div class="sbox"><input id="cq" placeholder="搜公司名，例如：可口可乐 / 保险 / IBM" value="' + esc(coQ) + '">' +
    '<button class="btn" id="cc">清空</button>' +
    '<span style="font-size:12.5px;color:var(--ink3)">' + coList().length + ' / ' + allNames.length + ' 家</span></div>';

  h += '<div class="cogrid">';
  coList().forEach(function(x){
    var c = x.c, ys = c.years || [];
    h += '<a class="co" href="#/co/' + encodeURIComponent(x.n) + '">' +
      '<h4>' + esc(x.n) + '</h4>' +
      '<div class="cmeta">' + ys.length + ' 个年份 · ' + (c.timeline || []).length + ' 条' +
      (ys.length ? ' · ' + ys[0] + '–' + ys[ys.length-1] : '') + '</div><div class="cpeek">';
    (c.timeline || []).filter(function(t){ return t.note; }).slice(0, 3).forEach(function(t){
      h += '<div><b>' + esc(t.y) + '</b>' + esc(t.note.slice(0, 40)) + '</div>';
    });
    h += '</div></a>';
  });
  h += '</div>';
  if (!coList().length) h += '<div class="empty">没有匹配的公司</div>';

  // 独立核实后补录的公司(源档案库没有收录, 只有原文出场追踪)
  var autoCos = C.companies.filter(function(e){ return e.auto; });
  if (autoCos.length){
    h += '<h2 class="h2">自动补录的公司 · ' + autoCos.length + ' 家</h2>' +
      '<p class="lead" style="margin-bottom:14px">上面 ' + allNames.length +
      ' 家来自实体档案库。下面这些在信件里反复出现、但档案库<b>没有收录</b>——' +
      '是拿信件全文独立扫描后补录的（如沃尔玛 16 个年份、宝洁 12 个年份、优先股 29 个年份）。' +
      '没有人工档案，但每一段出场都可点回原文。</p><div class="chips">';
    autoCos.slice().sort(function(a,b){ return entCount(b.name) - entCount(a.name); }).forEach(function(e){
      h += '<a class="chip" href="#/e/companies/' + encodeURIComponent(e.name) + '">' +
        esc(e.name) + ' <i>' + entCount(e.name) + ' 段</i></a>';
    });
    h += '</div>';
  }
  return h;
}
var coQ = '';
function coList(){
  var names = Object.keys(CT.companies || {});
  var q = coQ.trim();
  return names.map(function(n){ return {n:n, c:CT.companies[n]}; })
    .filter(function(x){ return !q || x.n.indexOf(q) !== -1; })
    .sort(function(a,b){ return (b.c.years||[]).length - (a.c.years||[]).length; });
}

/* ---------- 决策卡 ---------- */
var picks = {};
function decide(){
  var h = '<h1 class="h1">决策卡</h1><p class="lead">' +
    '只给你决策时点能掌握的信息。你先选，再揭晓他怎么做的、后来怎样。<br>' +
    '关键不在“猜对”，在于你能不能说出自己判断的理由。</p>';
  C.decisions.forEach(function(d){
    var p = picks[d.id];
    h += '<div class="dc"><h3>' + esc(d.title) + '</h3>' +
      '<div class="scmeta"><span class="tag b">' + d.year + ' 年</span>' +
      '<a href="#/e/companies/' + encodeURIComponent(d.entity) + '">' + esc(d.entity) + '</a></div>' +
      '<div class="scene">' + esc(d.scene) + '</div>' +
      '<ul class="facts">' + d.facts.map(function(f){ return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    if (p === undefined){
      h += '<div class="opts">' + d.options.map(function(o, i){
        return '<button class="opt" data-d="' + d.id + '" data-i="' + i + '"><span class="n">' +
          (i+1) + '.</span>' + esc(o.label) + '</button>';
      }).join('') + '</div>';
    } else {
      h += '<div class="you">你选的是 <b>' + esc(d.options[p].label) + '</b></div>';
      h += '<div class="opts">' + d.options.map(function(o, i){
        return '<button class="opt' + (i === p ? ' pick' : '') + '" disabled><span class="n">' +
          (i+1) + '.</span>' + esc(o.label) + '</button>';
      }).join('') + '</div>';
      h += '<div class="reveal"><div class="row actual"><span class="lb">他实际怎么做的</span>' + esc(d.actual) + '</div>' +
        '<div class="row result"><span class="lb">后来</span>' + esc(d.result) + '</div></div>';
    }
    h += '<div class="src">出处：' + esc(d.src) + '</div></div>';
  });
  return h;
}

/* ================= 第二步：术语演化 ================= */
function concepts(){
  var list = C.concepts.slice().sort(function(a,b){
    var ca = CT.concepts[a.name] || {}, cb = CT.concepts[b.name] || {};
    return ((cb.periods||[]).length + (cb.quotes||[]).length) -
           ((ca.periods||[]).length + (ca.quotes||[]).length);
  });
  var h = '<h1 class="h1">术语演化</h1><p class="lead">' +
    '同一个词，他在 ' + (CY1 - CY0 + 1) + ' 年里反复讲，说法会变，有时还会翻面。<br>' +
    '这里把每个概念按<b>分期</b>摊开：他在哪个阶段怎么说、什么时候改的口、改口的原因是什么。' +
    '分期和原话全部摘自语料，每条原话标了年份。</p>';
  h += '<div class="chips" style="margin-bottom:18px">';
  list.slice(0, 14).forEach(function(e){
    var auto = !CT.concepts[e.name];
    var c = CT.concepts[e.name] || {};
    h += '<a class="chip" href="' + (auto ? '#/e/concepts/' + encodeURIComponent(e.name) : '#/c/' + encodeURIComponent(e.name)) + '">' + esc(e.name) +
         ' <i>' + ((c.periods||[]).length) + ' 期 / ' + ((c.quotes||[]).length) + ' 句</i></a>';
  });
  h += '</div>';
  h += '<h2 class="h2">全部概念 · ' + list.length + '</h2><div class="cogrid">';
  list.forEach(function(e){
    var c = CT.concepts[e.name];
    var auto = !c;
    c = c || {};
    var ps = c.periods || [], qs = c.quotes || [];
    var span = ps.length ? (ps[0].y0 + '–' + ps[ps.length-1].y1) : '';
    // 自动补录概念没有人工档案(分期/原话), 直接给原文出场页
    var href = auto ? '#/e/concepts/' + encodeURIComponent(e.name)
                    : '#/c/' + encodeURIComponent(e.name);
    h += '<a class="co" href="' + href + '">' +
      '<h4>' + esc(e.name) + (auto ? ' <span class="tag autotag" style="font-size:10px;vertical-align:2px">补录</span>' : '') + '</h4>' +
      '<div class="cmeta">' + (auto
        ? '自动补录 · ' + entCount(e.name) + ' 段原文出场'
        : (span ? span + ' · ' : '') + ps.length + ' 个阶段 · ' + qs.length + ' 句原话') + '</div>' +
      '<div class="cpeek">' + (auto ? '' :
        ((ps[0] ? '<div><b>' + ps[0].y0 + '</b>' + esc(ps[0].text.slice(0, 44)) + '…</div>' : '') +
        (ps[1] ? '<div><b>' + ps[1].y0 + '</b>' + esc(ps[1].text.slice(0, 44)) + '…</div>' : ''))) +
      '</div></a>';
  });
  h += '</div>';
  return h;
}

function conceptPage(name){
  var c = CT.concepts[name];
  /* 补录概念没有人工档案（分期/原话）。以前这里直接返回"没有这个概念"，
     从收藏夹或外链进来就是一条死路；现在退回它的原文出场页。 */
  if (!c){
    if (IS_CONCEPT[name]) return entity('concepts', name);
    return notFound('概念', name);
  }
  var ps = c.periods || [], qs = c.quotes || [];
  // 时间轴原点取"语料起点"和"最早分期"里更早的那个，否则 1949/1956 那几段会画到轴外
  var pmin = CY0, pmax = CY1;
  ps.forEach(function(p){ pmin = Math.min(pmin, p.y0); pmax = Math.max(pmax, p.y1); });
  var Y0 = pmin, Y1 = pmax, SPAN = Y1 - Y0 + 1;

  var h = '<div class="epath"><a href="#/">年表</a> · <a href="#/concept">术语演化</a> · 概念</div>' +
    '<h1 class="ename">' + esc(name) + '</h1>' +
    '<div class="een">' + ps.length + ' 个阶段 · ' + qs.length + ' 句原话 · ' +
    '<a href="#/e/concepts/' + encodeURIComponent(name) + '">看它在原文里的全部出场</a></div>';
  if (c.def) h += '<div class="esum">' + esc(c.def) + '</div>';

  if (ps.length){
    h += '<h2 class="h2">思想演变 · 分期</h2><div class="pline">';
    ps.forEach(function(p){
      var w = Math.max(1, (p.y1 - p.y0 + 1)) / SPAN * 100;
      var x = (p.y0 - Y0) / SPAN * 100;
      h += '<div class="pd" style="flex-grow:' + Math.max(1, p.y1 - p.y0 + 1) + '">' +
        '<div class="bar"><i style="left:' + x.toFixed(1) + '%;width:' + w.toFixed(1) + '%"></i></div>' +
        '<div class="pn">' + esc(p.name) + '</div>' +
        yearLink(p.y0, p.y0 + ' – ' + p.y1 + (hasYear(p.y0) ? ' ↗' : ''), 'py',
          hasYear(p.y0) ? ('看 ' + p.y0 + ' 年的信') : (p.y0 + ' 年没有收录信件')) +
        '<div class="pt">' + esc(p.text.slice(0, 130)) + (p.text.length > 130 ? '…' : '') + '</div></div>';
    });
    h += '</div>';
    ps.forEach(function(p){
      h += '<div class="period"' + (hasYear(p.y0) ? ' data-jump="#/y/' + p.y0 + '" title="看 ' + p.y0 + ' 年的信"' : '') +
        '><div class="ph"><b>' + esc(p.name) + '</b>' +
        yearLink(p.y0, p.y0 + ' – ' + p.y1 + (hasYear(p.y0) ? ' ↗' : ''), '',
          hasYear(p.y0) ? ('看 ' + p.y0 + ' 年的信') : (p.y0 + ' 年没有收录信件')) + '</div>' +
        '<div class="pb">' + esc(p.text) + '</div></div>';
    });
  }

  if (qs.length){
    h += '<h2 class="h2">原话精选 · ' + qs.length + ' 句（按年份）</h2>';
    qs.slice().sort(function(a,b){ return a.y - b.y; }).forEach(function(q){
      h += '<div class="quote"' + jumpAttr(q.loc) + '><div class="qt">「' + esc(q.t) + '」</div>' +
        '<div class="qy">—— ' + q.y + ' 年' + (q.kind ? esc(q.kind) : '') + '信' +
        (q.note ? '（' + esc(q.note) + '）' : '') +
        locLink(q.loc) + '</div></div>';
    });
  }

  if ((c.pitfalls || []).length){
    h += '<h2 class="h2">常见误区</h2>';
    c.pitfalls.forEach(function(p){
      h += '<div class="pit">' + esc(p.replace(/\s+/g, ' ').trim()) + '</div>';
    });
  }
  if ((c.related || []).length){
    h += '<h2 class="h2">相关概念</h2><div class="chips">';
    c.related.forEach(function(r){
      h += entLink(r.name, 'chip', r.name, ' <i>' + esc(r.desc.slice(0, 22)) + '</i>');
    });
    h += '</div>';
  }
  if ((c.cases || []).length){
    h += '<h2 class="h2">典型案例公司</h2><div class="chips">';
    c.cases.forEach(function(r){
      h += entLink(r.name, 'chip', r.name, ' <i>' + esc(r.desc.slice(0, 22)) + '</i>');
    });
    h += '</div>';
  }
  return h;
}

/* ---------- 统一记分牌卡片渲染器（航空业/康菲同款样式，三层来源共用） ---------- */
function scCard(s, level){
  var vt = s.verdict === 'hit' ? '命中' : s.verdict === 'miss' ? '错判' :
           s.verdict === 'mix' ? '参半' : '未评';
  var vcls = s.verdict ? s.verdict : 'autotag';
  var h = '<div class="sc"><h3>' + esc(s.title || s.entity) + '</h3>' +
    '<div class="scmeta"><span class="tag ' + vcls + '">' + vt + '</span>' +
    (s.status ? '<span class="tag">' + esc(s.status) + '</span>' : '') +
    (level === 'auto' ? '<span class="tag autotag">自动整理 · 未逐条核对</span>' : '') +
    (s.entity && s.entityKind ?
      '<a href="#/e/' + s.entityKind + '/' + encodeURIComponent(s.entity) + '">' + esc(s.entity) + ' 的原文出场 →</a>' : '') +
    '</div>';
  if (s.claim){
    h += '<div class="claim"><span class="lb">' + s.claim.year + ' 年他说</span>「' + esc(s.claim.text) + '」' +
      (s.claim.confidence ? '<div class="cf">确定程度：' + esc(s.claim.confidence) + '</div>' : '') + '</div>';
  }
  if ((s.timeline || []).length){
    h += '<ul class="tl">';
    s.timeline.forEach(function(t){
      var kt = t.k === 'claim' ? '他说' : t.k === 'act' ? '动作' : '事实';
      h += '<li class="' + t.k + '"><b>' + (t.y !== undefined ? t.y : '') + '</b><span class="tag">' + kt + '</span> ' +
        esc(t.t) +
        (t.loc ? ' <a class="src-link" href="#/l/' + encodeURIComponent(t.loc.l) + '?b=' + t.loc.b + '">原文 ↗</a>' : '') +
        '</li>';
    });
    h += '</ul>';
  }
  if (s.outcome) h += '<div class="out"><span class="lb">结果</span>' + esc(s.outcome) + '</div>';
  if (s.lesson) h += '<div class="out" style="margin-top:8px;background:var(--accent-soft)">' +
    '<span class="lb" style="color:var(--accent)">教训</span>' + esc(s.lesson) + '</div>';
  h += '<div class="src">出处：' + esc(s.src) + '</div></div>';
  return h;
}
function locLink(loc, label){
  if (!loc) return '';
  return '<a class="src-link" href="#/l/' + encodeURIComponent(loc.l) + '?b=' + loc.b + '">' + (label || '原文 ↗') + '</a>';
}
/* 整块可点：把跳转目标挂在容器上，点句子任意位置都生效 */
function jumpAttr(loc){
  return loc ? ' data-jump="#/l/' + encodeURIComponent(loc.l) + '?b=' + loc.b + '"' : '';
}

/* ================= 第一步：公司记分牌（全量时间线） ================= */
function companyPage(name){
  var c = CT.companies[name];
  /* 自动补录的公司只有原文出场、没有人工时间线，退回实体页而不是死路 */
  if (!c){
    if (IS_COMPANY[name]) return entity('companies', name);
    return notFound('公司', name);
  }
  var ys = c.years || [], tl = c.timeline || [];
  var h = '<div class="epath"><a href="#/">年表</a> · <a href="#/score">记分牌</a> · 公司</div>' +
    '<h1 class="ename">' + esc(name) + '</h1>' +
    '<div class="een">' + (c.en ? esc(c.en) + ' · ' : '') + '在 ' + ys.length + ' 个年份被提到 · ' +
    '<a href="#/e/companies/' + encodeURIComponent(name) + '">看原文段落</a></div>';
  if (c.intro) h += '<div class="esum">' + esc(c.intro) + '</div>';
  if (c.history) h += '<div class="esum" style="border-left-color:#185fa5">' + esc(c.history) + '</div>';

  // 记分牌卡片: 三层来源, 同一样式

  var set = {};

  for (var y = 1957; y <= 2025; y++){
    h += '<div class="ax' + (set[y] ? ' on' : ' off') + '" data-cy="' + y + '" title="' +
      (set[y] ? y + ' · 点这里跳到当年记录' : y + ' · 档案里这一年没有单独条目') + '">' + y + '</div>';
  }
  h += '</div>';

  tl.forEach(function(t){
    h += '<div class="trow' + (t.tbl ? ' tblrow' : '') + '"' + jumpAttr(t.loc) + '><div class="ty">' + esc(t.y) + '</div>' +
      '<div class="tn">' + (t.tbl ? '<span class="tag autotag">持仓表</span> ' : '') +

      locLink(t.loc, t.tbl ? '跳原文表格 ↗' : '原文 ↗') + '</div></div>';
  });
  return h;
}

/* ================= 第三步：认错与自我修正 ================= */

var ruleQ = '';
